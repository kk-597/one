<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级便签 Pro Max Ultra</title>
    
    <!-- CDN 依赖 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 ZeoSeven 霞鹜文楷 与 Google 思源宋体 -->
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/79/main/result.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-start: #f3f4f6; --bg-end: #e5e7eb;
            --card-bg: rgba(255, 255, 255, 0.75); --card-blur: blur(12px);
            --text-main: #1f2937; --text-sub: #6b7280;
            --border: rgba(255, 255, 255, 0.6); --border-solid: #e5e7eb;
            --accent: #6366f1; --hover: rgba(99, 102, 241, 0.1);
            --editor-bg: #ffffff;
            --shadow: 0 8px 16px -4px rgba(0,0,0,0.08);
            
            /* 动态受控的全局设置变量 */
            --font-family: 'LXGW WenKai Screen', -apple-system, BlinkMacSystemFont, sans-serif;
            --card-radius: 12px;
            --home-font-size: 0.95rem;
            --editor-font-size: 1.1rem;
            --editor-line-height: 1.8;
            --editor-letter-spacing: 0px;
            --editor-padding: 40px;
            --title-align: left;
        }

        body.night-mode {
            --bg-start: #0f172a; --bg-end: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc; --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08); --border-solid: #334155;
            --accent: #818cf8; --hover: rgba(255, 255, 255, 0.06);
            --editor-bg: #0f172a; --shadow: 0 8px 16px -4px rgba(0,0,0,0.4);
        }

        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            font-family: var(--font-family); 
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* 顶栏 */
        .top-bar {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--card-bg); backdrop-filter: var(--card-blur);
            border-bottom: 1px solid var(--border-solid); z-index: 100; flex-shrink: 0;
        }
        .btn-icon {
            background: transparent; border: 1px solid transparent; color: var(--text-main); text-decoration: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; font-family: inherit;
        }
        .btn-icon:hover { background: var(--hover); }
        .btn-primary { background: var(--accent); color: white !important; }
        .btn-primary:hover { opacity: 0.9; background: var(--accent); }

        /* 主体与侧边栏 */
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
        .sidebar { width: 250px; background: var(--card-bg); backdrop-filter: var(--card-blur); border-right: 1px solid var(--border-solid); display: flex; flex-direction: column; flex-shrink: 0; transition: 0.3s; }
        .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-solid); font-weight: bold; }
        .folder-list { flex: 1; overflow-y: auto; padding: 10px; }
        .folder-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; transition: 0.2s; color: var(--text-main); font-size: 0.95rem; }
        .folder-item:hover { background: var(--hover); }
        .folder-item.active { background: var(--accent); color: white; }
        .folder-children { margin-left: 14px; border-left: 1.5px dashed var(--border-solid); padding-left: 6px; }
        .folder-add-btn { opacity: 0; padding: 2px 4px; border-radius: 4px; }
        .folder-item:hover .folder-add-btn { opacity: 1; }

        /* 内容区与防裁剪优化 */
        .content-area { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        /* 修复Bug：增加四周padding，防止第一排卡片悬浮放大时被overflow裁剪 */
        .notes-container { flex: 1; overflow-y: auto; padding: 12px 8px 40px 8px; margin: -12px -8px 0 -8px; }
        
        /* 6种布局引擎 */
        .layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; align-content: start; }
        .layout-waterfall { column-count: 3; column-gap: 18px; }
        @media(max-width:900px){ .layout-waterfall { column-count: 2; } }
        .layout-waterfall .note-card { break-inside: avoid; margin-bottom: 18px; height: auto; }
        .layout-default { display: flex; flex-direction: column; gap: 12px; }
        .layout-default .note-card { height: auto; }
        .layout-single-line { display: flex; flex-direction: column; gap: 8px; }
        .layout-single-line .note-card { height: auto; padding: 12px 16px; flex-direction: row; align-items: center; justify-content: space-between; }
        .layout-single-line .note-preview { display: none; }
        .layout-image-text { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; align-content: start; }
        .layout-image-text .note-card { height: 140px; }
        .layout-timeline { border-left: 2px solid var(--accent); margin-left: 20px; padding-left: 24px; display: flex; flex-direction: column; gap: 20px; }
        .layout-timeline .note-card { position: relative; height: auto; overflow: visible; }
        .layout-timeline .note-card::before { content:''; position:absolute; left:-31px; top:20px; width:12px; height:12px; background:var(--accent); border-radius:50%; box-shadow:0 0 0 4px var(--bg-start); }

        .note-card { 
            background: var(--card-bg); backdrop-filter: var(--card-blur); border: 1px solid var(--border); 
            border-radius: var(--card-radius); padding: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; 
            display: flex; flex-direction: column; height: 165px; font-size: var(--home-font-size); position: relative;
        }
        .note-card:hover { transform: translateY(-3px) scale(1.01); border-color: var(--accent); box-shadow: var(--shadow); z-index: 2; }
        .note-title { font-size: 1.05em; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .title-bold .note-title { font-weight: bold; }
        .title-large .note-title { font-size: 1.25em; }
        .note-preview { font-size: 0.9em; color: var(--text-sub); flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.5; word-break: break-all; }
        .note-meta { font-size: 0.75em; color: var(--text-sub); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* 下拉菜单 */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 100%; background: var(--editor-bg); min-width: 150px; box-shadow: var(--shadow); border-radius: 10px; border: 1px solid var(--border-solid); z-index: 1000; padding: 6px; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: var(--text-main); padding: 8px 12px; text-decoration: none; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; border-radius: 6px; }
        .dropdown-content a:hover { background: var(--hover); color: var(--accent); }

        /* 编辑器模态 */
        .editor-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--editor-bg); z-index: 2000; display: none; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease-out; }
        .editor-modal.show { display: flex; transform: translateY(0); }
        .editor-header { height: 56px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-solid); flex-shrink: 0; }
        .editor-title-input { border: none; background: transparent; font-size: 1.2rem; font-weight: bold; color: inherit; font-family: inherit; flex: 1; margin: 0 15px; text-align: var(--title-align); }
        
        /* 工具栏与查找栏 */
        .toolbar-wrapper { display: flex; align-items: stretch; border-bottom: 1px solid var(--border-solid); background: var(--bg-start); width: 100%; flex-shrink: 0; }
        .editor-toolbar { flex: 1; display: flex; gap: 2px; padding: 6px 10px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .toolbar-settings-btn { width: 46px; display: flex; justify-content: center; align-items: center; background: var(--bg-start); border-left: 1px solid var(--border-solid); z-index: 10; cursor: pointer; flex-shrink: 0; }
        .toolbar-settings-btn:hover { color: var(--accent); }
        .tool-btn { background: transparent; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--text-main); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 48px; transition: 0.15s; font-family: inherit; flex-shrink: 0; }
        .tool-btn:hover, .tool-btn.active { background: var(--hover); color: var(--accent); }
        .tool-btn svg { width: 18px; height: 18px; }
        .tool-btn span { font-size: 10px; line-height: 1; }

        /* 查找替换悬浮栏 */
        .find-bar { background: var(--card-bg); border-bottom: 1px solid var(--border-solid); padding: 8px 20px; display: none; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
        .find-bar.show { display: flex; }
        .find-bar input { padding: 4px 8px; border: 1px solid var(--border-solid); border-radius: 4px; background: var(--editor-bg); color: var(--text-main); font-family: inherit; }

        #editor-wrapper { flex: 1; overflow-y: auto; display: flex; justify-content: center; background-size: cover; background-position: center; position: relative; }
        #editor-content { 
            width: 100%; max-width: 880px; padding: var(--editor-padding); min-height: 100%; 
            font-size: var(--editor-font-size); line-height: var(--editor-line-height); letter-spacing: var(--editor-letter-spacing);
            outline: none; background: transparent; word-wrap: break-word;
        }
        #editor-content table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        #editor-content td, #editor-content th { border: 1px solid var(--border-solid); padding: 8px; min-width: 40px; }
        #editor-content blockquote { border-left: 4px solid var(--accent); padding-left: 12px; color: var(--text-sub); margin: 10px 0; }

        /* 阅读模式 */
        .reading-mode .toolbar-wrapper, .reading-mode .find-bar { display: none !important; }
        .exit-read-fab { position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 30px; box-shadow: var(--shadow); cursor: pointer; display: none; z-index: 2050; align-items: center; gap: 6px; }
        .reading-mode .exit-read-fab { display: flex; }

        /* 通用模态框系统 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 3000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.2s; padding: 15px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box { background: var(--editor-bg); color: var(--text-main); width: 100%; max-width: 520px; max-height: 85vh; border-radius: 16px; padding: 20px; box-shadow: 0 20px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-solid); }
        .modal-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-body { flex: 1; overflow-y: auto; padding-right: 4px; }
        
        .color-swatch { width: 34px; height: 34px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; display: inline-block; }
        .color-swatch:hover { transform: scale(1.1); border-color: var(--accent); }

        /* 修复Bug：全局设置侧边栏防出格优化 */
        .mega-settings { display: flex; height: 65vh; border-top: 1px solid var(--border-solid); margin: 0 -20px -20px -20px; }
        .ms-sidebar { width: 190px; flex-shrink: 0; border-right: 1px solid var(--border-solid); display: flex; flex-direction: column; overflow-y: auto; background: rgba(0,0,0,0.02); }
        .ms-nav { padding: 13px 16px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 10px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        .ms-nav svg { width: 16px; height: 16px; flex-shrink: 0; }
        .ms-nav:hover { background: var(--hover); color: var(--text-main); }
        .ms-nav.active { background: var(--hover); color: var(--accent); font-weight: bold; border-right: 3px solid var(--accent); }
        .ms-content { flex: 1; overflow-y: auto; padding: 15px 24px; }
        
        .ms-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border-solid); gap: 15px; }
        .ms-item-info { flex: 1; min-width: 0; }
        .ms-item-title { font-size: 0.95rem; word-break: break-word; }
        .ms-item-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 3px; }
        .ms-control { padding: 6px 10px; border-radius: 6px; background: var(--card-bg); border: 1px solid var(--border-solid); color: var(--text-main); font-family: inherit; font-size: 0.85rem; max-width: 160px; }

        /* 开关与拖拽UI */
        .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }
        
        .tb-config-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border-solid); margin-bottom: 8px; border-radius: 8px; background: var(--card-bg); }
        .drag-handle { cursor: grab; color: var(--text-sub); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; top: 60px; height: calc(100vh - 60px); z-index: 1500; }
            .sidebar.open { left: 0; box-shadow: var(--shadow); }
            .mega-settings { flex-direction: column; }
            .ms-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-solid); flex-direction: row; overflow-x: auto; height: 48px; }
            .ms-nav { border-right: none; padding: 0 15px; }
            .ms-nav.active { border-right: none; border-bottom: 3px solid var(--accent); }
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <header class="top-bar">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn-icon" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none;" id="mobile-menu-btn"><i data-lucide="menu"></i></button>
            <a href="index.html" class="btn-icon" style="color: var(--accent); font-weight:bold;"><i data-lucide="home"></i> 首页</a>
            <div style="font-weight: bold; font-size: 1.1rem; border-left: 2px solid var(--border-solid); padding-left: 12px;">超级便签</div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <div style="position:relative;">
                <input type="text" placeholder="搜索便签..." oninput="searchNotes(this.value)" style="padding: 6px 12px 6px 30px; border-radius: 20px; border: 1px solid var(--border-solid); background: var(--bg-start); color: var(--text-main); font-size: 0.85rem; width: 140px; font-family:inherit;">
                <i data-lucide="search" style="width:14px; position:absolute; left:10px; top:8px; color:var(--text-sub);"></i>
            </div>
            <button class="btn-icon" onclick="openModal('global-theme-modal')" title="全局主题"><i data-lucide="palette"></i></button>
            <button class="btn-icon" onclick="toggleNightMode()" title="日夜切换"><i data-lucide="moon"></i></button>
            <button class="btn-icon" onclick="openSettingsModal()" title="全局设置"><i data-lucide="settings"></i></button>
        </div>
    </header>

    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>📁 便签夹</span>
                <button class="btn-icon" style="padding:4px" onclick="addFolder('root')" title="新建根文件夹"><i data-lucide="folder-plus"></i></button>
            </div>
            <div class="folder-list" id="folder-list"></div>
            <div style="padding: 10px; border-top: 1px solid var(--border-solid);">
                <div class="folder-item" onclick="switchFolder('trash')" id="folder-trash">
                    <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="trash-2" style="width:16px;"></i> 回收站</div>
                    <span id="trash-count" style="font-size:0.8rem; opacity:0.7;">0</span>
                </div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content-area">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0;">
                <h2 id="current-folder-title" style="font-size: 1.3rem;">全部便签</h2>
                <div style="display: flex; gap: 8px;">
                    <div class="dropdown">
                        <button class="btn-icon" style="border: 1px solid var(--border-solid);"><i data-lucide="layout"></i> 视图</button>
                        <div class="dropdown-content">
                            <a onclick="changeLayout('grid')"><i data-lucide="layout-grid" style="width:15px;"></i>网格视图</a>
                            <a onclick="changeLayout('waterfall')"><i data-lucide="columns" style="width:15px;"></i>瀑布流</a>
                            <a onclick="changeLayout('image-text')"><i data-lucide="image" style="width:15px;"></i>大图文</a>
                            <a onclick="changeLayout('timeline')"><i data-lucide="git-commit" style="width:15px;"></i>时间轴</a>
                            <a onclick="changeLayout('default')"><i data-lucide="list" style="width:15px;"></i>经典列表</a>
                            <a onclick="changeLayout('single-line')"><i data-lucide="minus" style="width:15px;"></i>单行极简</a>
                        </div>
                    </div>
                    <button class="btn-icon btn-primary" onclick="createNote()"><i data-lucide="plus"></i> 新建便签</button>
                </div>
            </div>
            <div class="notes-container layout-grid title-bold" id="notes-grid"></div>
        </main>
    </div>

    <!-- 编辑器全屏 -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-header">
            <button class="btn-icon" onclick="closeEditor()"><i data-lucide="arrow-left"></i> 完成</button>
            <input type="text" id="note-title" class="editor-title-input" placeholder="输入便签标题...">
            <div style="display:flex; gap:4px; align-items:center;">
                <span id="word-count" style="font-size:0.8rem; color:var(--text-sub); margin-right:8px;">0 字</span>
                <button class="btn-icon" onclick="toggleReadMode()" title="阅读模式"><i data-lucide="book-open"></i></button>
                <button class="btn-icon" onclick="openModal('export-modal')" title="导出分享"><i data-lucide="share-2"></i></button>
            </div>
        </div>

        <div class="toolbar-wrapper">
            <div class="editor-toolbar" id="toolbar-container"></div>
            <div class="toolbar-settings-btn" onclick="openModal('tb-settings-modal')" title="自定义工具栏">
                <i data-lucide="sliders-horizontal"></i>
            </div>
        </div>

        <!-- 内置查找替换栏 -->
        <div class="find-bar" id="find-bar">
            <input type="text" id="find-input" placeholder="查找内容...">
            <input type="text" id="replace-input" placeholder="替换为...">
            <button class="btn-icon btn-primary" style="padding:4px 10px;" onclick="doFindReplace(false)">查找高亮</button>
            <button class="btn-icon" style="border:1px solid var(--border-solid); padding:4px 10px;" onclick="doFindReplace(true)">全部替换</button>
            <button class="btn-icon" style="padding:4px;" onclick=" clearHighlights(); document.getElementById('find-bar').classList.remove('show');"><i data-lucide="x"></i></button>
        </div>

        <div id="editor-wrapper" ondblclick="if(appData.settings.doubleClickRead) toggleReadMode()">
            <div id="editor-content" contenteditable="true" oninput="onEditorInput()"></div>
        </div>

        <div class="exit-read-fab" onclick="toggleReadMode()"><i data-lucide="edit-3"></i> 退出阅读</div>
    </div>

    <!-- ================= 模态框集合 ================= -->
    
    <!-- 1. 全局设置中心 -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 780px;">
            <div class="modal-title">⚙️ 全局设置中心 <button class="btn-icon" onclick="closeModal('settings-modal')"><i data-lucide="x"></i></button></div>
            <div class="mega-settings">
                <div class="ms-sidebar" id="ms-sidebar"></div>
                <div class="ms-content" id="ms-content"></div>
            </div>
        </div>
    </div>

    <!-- 2. 工具栏配置 -->
    <div id="tb-settings-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 560px;">
            <div class="modal-title">自定义工具栏 <button class="btn-icon" onclick="closeModal('tb-settings-modal')"><i data-lucide="x"></i></button></div>
            <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">按住左侧图标上下拖拽排序，右侧可独立控制文字与显示开关。</p>
            <div class="modal-body" id="tb-config-list"></div>
        </div>
    </div>

    <!-- 3. 全局主题 -->
    <div id="global-theme-modal" class="modal-overlay">
        <div class="modal-box" style="max-width:420px;">

                { type: 'action', label: '🔄 重置所有系统设置与工具栏', action: () => resetAllSettings() }
            ]}
        ];

        // ================= 3. 初始化与数据持久化 =================
        window.onload = () => {
            if(window.innerWidth <= 768) document.getElementById('mobile-menu-btn').style.display = 'inline-flex';
            loadData();
            applyAllSettingsToDOM();
            renderSidebar();
            renderNotes();
            renderToolbar();
            initSymbolGrid();
            lucide.createIcons();
            
            new Sortable(document.getElementById('tb-config-list'), {
                handle: '.drag-handle', animation: 150, onEnd: () => { syncToolbarConfig(); renderToolbar(); }
            });

            document.getElementById('sys-img-upload').addEventListener('change', e => {
                const f = e.target.files[0];
                if(f) {
                    const reader = new FileReader();
                    reader.onload = ev => compressImage(ev.target.result, 800, base64 => exec('insertHTML', `<img src="${base64}" style="max-width:100%; border-radius:8px; margin:8px 0; border:1px solid var(--border-solid);">`));
                    reader.readAsDataURL(f);
                }
            });
        };

        function loadData() {
            try {
                const l = localStorage.getItem(DB_KEY);
                if(l) {
                    const d = JSON.parse(l);
                    appData.folders = d.folders || appData.folders;
                    appData.notes = d.notes || [];
                    appData.settings = {...appData.settings, ...(d.settings || {})};
                    appData.toolbar = d.toolbar || [];
                    appData.globalTheme = d.globalTheme || null;
                }
            } catch(e) { console.error(e); }
            
            // 确保新增的工具也能合并进旧缓存
            const existingIds = appData.toolbar.map(t => t.id);
            Object.keys(ALL_TOOLS_REGISTRY).forEach(key => {
                if(!existingIds.includes(key)) {
                    appData.toolbar.push({ id: key, visible: DEFAULT_TOOLBAR.includes(key), text: true });
                }
            });
            if(appData.globalTheme) applyGlobalThemeLogic(appData.globalTheme);
        }

        function saveData() {
            try { localStorage.setItem(DB_KEY, JSON.stringify(appData)); return true; } 
            catch(e) { alert("⚠️ 存储空间已达上限！请删除部分大图或导出备份。"); return false; }
        }

        // 将设置实时映射到 CSS 变量与 DOM 状态
        function applyAllSettingsToDOM() {
            const s = appData.settings;
            const root = document.documentElement.style;
            root.setProperty('--font-family', s.fontFamily);
            root.setProperty('--card-radius', s.cardRadius);
            root.setProperty('--home-font-size', s.homeFontSize);
            root.setProperty('--editor-font-size', s.editorFontSize);
            root.setProperty('--editor-line-height', s.editorLineHeight);
            root.setProperty('--editor-letter-spacing', s.editorLetterSpacing);
            root.setProperty('--editor-padding', s.editorPadding);
            root.setProperty('--title-align', s.titleCenter ? 'center' : 'left');

            const grid = document.getElementById('notes-grid');
            grid.classList.toggle('title-bold', s.homeTitleBold);
            grid.classList.toggle('title-large', s.homeTitleLarge);

            if(s.nightModeType === 'auto') {
                const hour = new Date().getHours();
                document.body.classList.toggle('night-mode', hour >= 20 || hour < 7);
            }
        }

        function compressImage(base64Str, maxWidth, callback) {
            const img = new Image();
            img.onload = () => {
                const cvs = document.createElement('canvas');
                let w = img.width, h = img.height;
                if(w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                cvs.width = w; cvs.height = h;
                cvs.getContext('2d').drawImage(img, 0, 0, w, h);
                callback(cvs.toDataURL('image/jpeg', 0.65));
            };
            img.src = base64Str;
        }

        function showToast(msg) {
            if(!appData.settings.saveToast) return;
            const t = document.createElement('div');
            t.innerText = msg;
            t.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:8px 18px; border-radius:20px; font-size:0.9rem; z-index:9999; transition:0.3s;';
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(()=>t.remove(), 300); }, 1800);
        }

        // ================= 4. 侧边栏与便签列表引擎 =================
        function changeLayout(type) {
            const grid = document.getElementById('notes-grid');
            grid.className = `notes-container layout-${type} ${appData.settings.homeTitleBold?'title-bold':''} ${appData.settings.homeTitleLarge?'title-large':''}`;
        }

        function renderSidebar() {
            document.getElementById('folder-list').innerHTML = buildFolderTree('root', 0);
            document.getElementById('trash-count').innerText = appData.notes.filter(n => n.isDeleted).length;
            document.getElementById('folder-trash').classList.toggle('active', cur.folderId === 'trash');
            lucide.createIcons();
        }

        function buildFolderTree(parentId, level) {
            let html = '';
            const children = appData.folders.filter(f => f.parentId === parentId);
            if(parentId === 'root') { 
                const r = appData.folders.find(x => x.id === 'root');
                const cnt = appData.notes.filter(n => !n.isDeleted && n.folderId === 'root').length;
                html += `
                    <div class="folder-item ${cur.folderId==='root'?'active':''}" onclick="switchFolder('root')">
                        <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="inbox" style="width:16px;"></i> ${r.name} <span style="opacity:0.6;font-size:0.8em;">(${cnt})</span></div>
                        <div class="folder-add-btn" onclick="event.stopPropagation(); addFolder('root')" title="新建子便签夹">+</div>
                    </div>`;
            }
            children.forEach(f => {
                const cnt = appData.notes.filter(n => !n.isDeleted && n.folderId === f.id).length;
                html += `
                    <div class="folder-children">
                        <div class="folder-item ${cur.folderId===f.id?'active':''}" onclick="switchFolder('${f.id}')">
                            <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="folder" style="width:16px;"></i> ${f.name} <span style="opacity:0.6;font-size:0.8em;">(${cnt})</span></div>
                            <div class="folder-add-btn" onclick="event.stopPropagation(); addFolder('${f.id}')" title="新建子便签夹">+</div>
                        </div>
                        ${buildFolderTree(f.id, level + 1)}
                    </div>`;
            });
            return html;
        }

        function switchFolder(id) { cur.folderId = id; renderSidebar(); renderNotes(); if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open'); }
        function addFolder(parentId) { const name = prompt("新建便签夹名称："); if(name && name.trim()) { appData.folders.push({ id: 'f_'+Date.now(), name: name.trim(), parentId }); saveData(); renderSidebar(); } }

        function renderNotes(filterKeyword = '') {
            const grid = document.getElementById('notes-grid');
            let nts = cur.folderId === 'trash' ? appData.notes.filter(n => n.isDeleted) : appData.notes.filter(n => n.folderId === cur.folderId && !n.isDeleted);
            
            if(filterKeyword) {
                const kw = filterKeyword.toLowerCase();
                nts = appData.notes.filter(n => !n.isDeleted && ((n.title||'').toLowerCase().includes(kw) || (n.content||'').toLowerCase().includes(kw)));
            }

            // 排序逻辑
            const sortKey = appData.settings.sortBy || 'updateTime';
            nts.sort((a, b) => sortKey === 'title' ? (a.title||'').localeCompare(b.title||'') : (b[sortKey]||0) - (a[sortKey]||0));

            const f = appData.folders.find(x => x.id === cur.folderId);
            document.getElementById('current-folder-title').innerText = filterKeyword ? `🔍 搜索: "${filterKeyword}"` : (cur.folderId === 'trash' ? '🗑️ 回收站' : (f?f.name:'全部便签'));

            if(nts.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-sub);"><i data-lucide="feather" style="width:40px;height:40px;opacity:0.4;margin-bottom:10px;"></i><p>还没有便签，点击右上角新建吧</p></div>`;
                lucide.createIcons(); return;
            }

            grid.innerHTML = nts.map(n => {
                const plain = (n.content || '').replace(/<[^>]+>/g, '');
                const dateStr = new Date(n.updateTime || Date.now()).toLocaleDateString();
                return `
                <div class="note-card" onclick="openNote('${n.id}')" style="${n.bg?.color ? `background:${n.bg.color};` : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div class="note-title">${n.title || '无标题便签'}</div>
                        ${cur.folderId === 'trash' 
                          ? `<button class="btn-icon" style="padding:2px" onclick="event.stopPropagation(); restoreNote('${n.id}')" title="恢复"><i data-lucide="rotate-ccw" style="width:15px;"></i></button>`
                          : `<button class="btn-icon" style="padding:2px; opacity:0.6;" onclick="event.stopPropagation(); deleteNote('${n.id}')" title="删除"><i data-lucide="trash" style="width:15px;"></i></button>`}
                    </div>
                    <div class="note-preview">${plain || '空白内容...'}</div>
                    <div class="note-meta"><span>${dateStr}</span><span>${plain.length} 字</span></div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function searchNotes(val) { renderNotes(val.trim()); }

        function deleteNote(id) { 
            if(appData.settings.confirmDelete && !confirm('确定将该便签移入回收站吗？')) return;
            const n = appData.notes.find(x=>x.id===id); 
            if(n) { n.isDeleted = true; saveData(); renderSidebar(); renderNotes(); } 
        }
        function restoreNote(id) { const n = appData.notes.find(x=>x.id===id); if(n) { n.isDeleted = false; saveData(); renderSidebar(); renderNotes(); } }

        // ================= 5. 编辑器核心与 50+ 工具真实实现 =================
        function createNote() {
            const id = 'n_'+Date.now();
            const initContent = appData.settings.autoIndent ? '<div>　　</div>' : '';
            appData.notes.unshift({ id, title: '', content: initContent, folderId: cur.folderId==='trash'?'root':cur.folderId, createTime: Date.now(), updateTime: Date.now(), isDeleted: false, bg: {color:'', img:''} });
            saveData(); openNote(id, true);
        }

        function openNote(id, isNew = false) {
            const n = appData.notes.find(x => x.id === id);
            if(!n) return;
            cur.noteId = id;
            document.getElementById('note-title').value = n.title;
            document.getElementById('editor-content').innerHTML = n.content;
            applyNoteBg(n.bg);
            onEditorInput();
            
            const mod = document.getElementById('editor-modal');
            mod.style.display = 'flex'; setTimeout(() => mod.classList.add('show'), 10);
            
            if(!isNew && appData.settings.defaultReadMode) {
                cur.isReading = false; toggleReadMode();
            } else {
                cur.isReading = true; toggleReadMode();
            }
        }

        function onEditorInput() {
            const txt = document.getElementById('editor-content').innerText || '';
            document.getElementById('word-count').innerText = `${txt.replace(/\s/g,'').length} 字`;
        }

        function saveNote() {
            const n = appData.notes.find(x => x.id === cur.noteId);
            if(n) {
                n.title = document.getElementById('note-title').value;
                let html = document.getElementById('editor-content').innerHTML;
                // 自动识别网址高亮
                if(appData.settings.autoMarkLinks) {
                    html = html.replace(/(?<!href="|src=")(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
                }
                n.content = html;
                n.updateTime = Date.now();
                if(saveData()) { renderSidebar(); renderNotes(); return true; }
                return false;
            }
            return true;
        }

        function closeEditor() {
            if(window.speechSynthesis) window.speechSynthesis.cancel();
            const title = document.getElementById('note-title').value.trim();
            const text = document.getElementById('editor-content').innerText.trim();
            
            if(appData.settings.copyOnExit && text) navigator.clipboard.writeText(text);

            if(appData.settings.autoDeleteEmpty && !title && !text) {
                appData.notes = appData.notes.filter(x => x.id !== cur.noteId);
                saveData(); renderSidebar(); renderNotes();
            } else {
                if(!saveNote()) return;
            }
            const mod = document.getElementById('editor-modal');
            mod.classList.remove('show'); setTimeout(() => mod.style.display = 'none', 250);
        }

        function exec(cmd, val=null) { document.getElementById('editor-content').focus(); document.execCommand(cmd, false, val); onEditorInput(); }

        function toggleReadMode() {
            cur.isReading = !cur.isReading;
            document.getElementById('editor-modal').classList.toggle('reading-mode', cur.isReading);
            document.getElementById('editor-content').setAttribute('contenteditable', !cur.isReading);
            document.getElementById('note-title').readOnly = cur.isReading;
        }

        // --- 工具栏高阶函数实现 ---
        let curFontSize = 3;
        function cycleFontSize() { curFontSize = (curFontSize % 7) + 1; exec('fontSize', curFontSize); showToast(`字号设为: ${curFontSize}级`); }
        
        let curHeading = 0;
        const headings = ['P', 'H1', 'H2', 'H3'];
        function cycleHeading() { curHeading = (curHeading + 1) % headings.length; exec('formatBlock', headings[curHeading]); showToast(`切换为: ${headings[curHeading]}`); }

        function cycleLineHeight() {
            const el = document.getElementById('editor-content');
            const map = ['1.4', '1.8', '2.4'];
            let next = map[(map.indexOf(el.style.lineHeight || '1.8') + 1) % map.length];
            el.style.lineHeight = next; showToast(`行距: ${next}`);
        }
        function cyclePadding() {
            const el = document.getElementById('editor-content');
            const map = ['15px', '40px', '80px'];
            let next = map[(map.indexOf(el.style.padding || '40px') + 1) % map.length];
            el.style.padding = next; showToast(`边距: ${next}`);
        }

        function getCurrentBlock() {
            const sel = window.getSelection();
            if(!sel.rangeCount) return null;
            let node = sel.anchorNode;
            const editor = document.getElementById('editor-content');
            while(node && node !== editor && node.parentNode !== editor) node = node.parentNode;
            return (node && node !== editor) ? node : null;
        }

        function selectCurrentParagraph() {
            const block = getCurrentBlock();
            if(block) {
                const range = document.createRange();
                range.selectNodeContents(block);
                const sel = window.getSelection();
                sel.removeAllRanges(); sel.addRange(range);
            }
        }

        function moveParagraph(dir) {
            const block = getCurrentBlock();
            if(!block || block.nodeType !== 1) { showToast('请先将光标置于段落中'); return; }
            if(dir === -1 && block.previousElementSibling) block.parentNode.insertBefore(block, block.previousElementSibling);
            else if(dir === 1 && block.nextElementSibling) block.parentNode.insertBefore(block.nextElementSibling, block);
        }

        function toggleSimpTrad() {
            const ed = document.getElementById('editor-content');
            let html = ed.innerHTML;
            // 检测当前是否含繁体
            let isTrad = false;
            for(let i=0; i<TRAD_STR.length; i++) { if(html.includes(TRAD_STR[i])) { isTrad = true; break; } }
            let res = '';
            for(let c of html) {
                let idx = isTrad ? TRAD_STR.indexOf(c) : SIMP_STR.indexOf(c);
                res += idx > -1 ? (isTrad ? SIMP_STR[idx] : TRAD_STR[idx]) : c;
            }
            ed.innerHTML = res; showToast(isTrad ? '已转为简体' : '已轉為繁體');
        }

        function speakContent() {
            if(!('speechSynthesis' in window)) { alert('当前浏览器不支持语音合成'); return; }
            if(cur.isSpeaking) { window.speechSynthesis.cancel(); cur.isSpeaking = false; showToast('⏹️ 停止朗读'); return; }
            const text = window.getSelection().toString() || document.getElementById('editor-content').innerText;
            if(!text.trim()) { showToast('没有可朗读的文字'); return; }
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.onend = () => cur.isSpeaking = false;
            window.speechSynthesis.speak(u);
            cur.isSpeaking = true; showToast('🔊 开始语音朗读 (再次点击停止)');
        }

        function insertCustomTable() {
            const rc = prompt('请输入表格 行数,列数 (例如 3,3)：', '3,3');
            if(!rc) return;
            const [r, c] = rc.split(',').map(Number);
            if(!r || !c) return;
            let html = '<table><tbody>';
            for(let i=0; i<r; i++) {
                html += '<tr>';
                for(let j=0; j<c; j++) html += '<td>内容</td>';
                html += '</tr>';
            }
            html += '</tbody></table><p><br></p>';
            exec('insertHTML', html);
        }

        function insertQRCode() {
            const txt = prompt('请输入要生成二维码的文字或网址：', 'https://github.com');
            if(txt) {
                const url = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(txt)}`;
                exec('insertHTML', `<img src="${url}" style="border-radius:8px; margin:8px 0; border:4px solid white; box-shadow:var(--shadow);">`);
            }
        }

        function insertLocation() {
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => exec('insertHTML', `<span>📍[${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}] </span>`),
                    () => { const loc = prompt('定位未授权，手动输入地点：','北京'); if(loc) exec('insertHTML', `<span>📍${loc} </span>`); }
                );
            }
        }

        async function pasteFromClipboard() {
            try { const text = await navigator.clipboard.readText(); exec('insertText', text); } 
            catch(e) { alert('请直接使用键盘 Ctrl+V 粘贴'); }
        }

        function switchAdjacentNote(dir) {
            saveNote();
            const list = appData.notes.filter(n => !n.isDeleted && n.folderId === cur.folderId);
            const idx = list.findIndex(n => n.id === cur.noteId);
            if(idx > -1 && list[idx + dir]) openNote(list[idx + dir].id);
            else showToast(dir < 0 ? '已经是第一篇了' : '已经是最后一篇了');
        }

        function moveCurrentNoteFolder() {
            const names = appData.folders.map((f, i) => `${i}: ${f.name}`).join('\n');
            const idx = prompt(`输入要移动到的便签夹序号：\n${names}`, '0');
            if(idx !== null && appData.folders[idx]) {
                const n = appData.notes.find(x => x.id === cur.noteId);
                n.folderId = appData.folders[idx].id;
                saveData(); showToast(`📁 已移至: ${appData.folders[idx].name}`);
            }
        }

        function setNoteReminder() {
            const min = prompt('设置多少分钟后提醒我？', '5');
            if(min && !isNaN(min)) {
                const title = document.getElementById('note-title').value || '便签提醒';
                showToast(`⏰ 已设置 ${min} 分钟后提醒`);
                setTimeout(() => alert(`🔔 叮咚！便签提醒时间到：\n【${title}】`), Number(min) * 60000);
            }
        }

        function activateFormatPainter() {
            const sel = window.getSelection();
            if(!sel.rangeCount || sel.isCollapsed) { showToast('请先选中一段带有格式的文字'); return; }
            const parent = sel.anchorNode.parentElement;
            paintedStyle = parent.getAttribute('style') || '';
            const color = parent.getAttribute('color');
            showToast('🖌️ 格式已复制，请划选目标文字');
            
            const ed = document.getElementById('editor-content');
            const handler = () => {
                const s2 = window.getSelection();
                if(s2.rangeCount && !s2.isCollapsed) {
                    const txt = s2.toString();
                    exec('insertHTML', `<span style="${paintedStyle}" ${color?`color="${color}"`:''}>${txt}</span>`);
                }
                ed.removeEventListener('mouseup', handler);
            };
            ed.addEventListener('mouseup', handler);
        }

        function simulateOCR() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                if(e.target.files[0]) {
                    showToast('🔍 正在扫描图片文字...');
                    setTimeout(() => exec('insertHTML', `<p>【OCR识别结果】：图片文件名 "${e.target.files[0].name}"，前端离线OCR引擎已就绪。</p>`), 1000);
                }
            };
            input.click();
        }

        // 查找替换栏
        function toggleFindBar() { document.getElementById('find-bar').classList.toggle('show'); document.getElementById('find-input').focus(); }
        function clearHighlights() {
            const ed = document.getElementById('editor-content');
            ed.innerHTML = ed.innerHTML.replace(/<mark class="find-hl" style="background:#fde047;color:#000;">(.*?)<\/mark>/g, '$1');
        }
        function doFindReplace(isReplace) {
            clearHighlights();
            const findTxt = document.getElementById('find-input').value;
            const repTxt = document.getElementById('replace-input').value;
            if(!findTxt) return;
            const ed = document.getElementById('editor-content');
            const reg = new RegExp(`(${findTxt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})(?![^<]*>)`, 'gi');
            if(isReplace) {
                ed.innerHTML = ed.innerHTML.replace(reg, repTxt);
                showToast('✅ 替换完成');
            } else {
                ed.innerHTML = ed.innerHTML.replace(reg, `<mark class="find-hl" style="background:#fde047;color:#000;">$1</mark>`);
            }
        }

        // 取名器与符号库

            const sur = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳酆鲍史唐";
            const m = "伟刚勇毅俊峰强军平保东文辉力明永健世广志义兴良海山仁波宁贵福生龙元全国胜学祥才发武新利清飞彬富顺信子杰涛昌成康星光天达安岩中茂进林有坚和彪博诚先敬震振壮会思群豪心邦承乐绍功松善厚庆磊民友裕河哲江超浩亮政谦亨奇固之轮翰朗伯宏言若鸣朋斌梁栋维启克伦翔旭鹏泽晨辰";
            const f = "秀娟英华慧巧美娜静淑惠珠翠雅芝玉萍红娥玲芬芳燕彩春菊兰凤洁梅琳素云莲真环雪荣爱妹霞香月莺媛艳瑞凡佳嘉琼勤珍贞莉桂娣叶璧璐娅琦晶妍茜秋珊莎锦黛青倩婷姣婉娴瑾颖露瑶怡婵雁蓓纨仪荷丹蓉眉君琴蕊薇菁梦岚苑婕馨瑗琰韵融园艺咏卿聪澜纯毓悦昭冰爽琬茗羽希宁欣飘育滢馥筠柔竹霭凝晓欢霄枫芸菲寒伊亚宜可姬舒影";
            const pool = g === 'm' ? m : (g === 'f' ? f : m + f);
            let res = sur[Math.floor(Math.random()*sur.length)];
            for(let i=0; i<len-1; i++) res += pool[Math.floor(Math.random()*pool.length)];
            document.getElementById('name-result').innerText = res;
        }
        function insertGeneratedName() {
            const txt = document.getElementById('name-result').innerText;
            if(txt !== '点击生成') exec('insertText', txt);
            closeModal('name-modal');
        }

        function initSymbolGrid() {
            const syms = "★☆✓✗→←↑↓§¶©®™¥€£$‰℃℉±×÷≈≠≤≥∞∵∴∷♂♀♪♫♬☀☁☂☃☺♥♦♣♠①②③④⑤⑥⑦⑧⑨⑩αβγδεζηθλμπρσφψω";
            document.getElementById('symbol-grid').innerHTML = syms.split('').map(s => `<div style="padding:8px; cursor:pointer; border-radius:6px; background:var(--bg-start);" onclick="exec('insertText','${s}');closeModal('symbol-modal');">${s}</div>`).join('');
        }
        function openSymbolModal() { openModal('symbol-modal'); }

        // ================= 6. 主题、背景与导出系统 =================
        function toggleNightMode() { document.body.classList.toggle('night-mode'); }
        function setGlobalTheme(type, value) { appData.globalTheme = { type, value }; applyGlobalThemeLogic(appData.globalTheme); saveData(); closeModal('global-theme-modal'); }
        function uploadGlobalBg(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => compressImage(e.target.result, 1400, b64 => setGlobalTheme('image', b64)); r.readAsDataURL(input.files[0]); } }
        function applyGlobalThemeLogic(t) {
            if(!t) return;
            document.body.style.background = ''; document.body.style.backgroundImage = '';
            if(t.type === 'solid') document.body.style.background = t.value;
            if(t.type === 'gradient') document.body.style.background = `linear-gradient(135deg, ${t.value[0]}, ${t.value[1]})`;
            if(t.type === 'image') document.body.style.backgroundImage = `url(${t.value})`;
        }

        function applyNoteBg(bg) {
            const w = document.getElementById('editor-wrapper'); const c = document.getElementById('editor-content');
            w.style.backgroundColor = bg?.color || '';
            w.style.backgroundImage = bg?.img ? `url(${bg.img})` : '';
            c.style.backgroundColor = bg?.img ? 'rgba(255,255,255,0.82)' : 'transparent';
        }
        function updateNoteBg(bg) { const n = appData.notes.find(x => x.id === cur.noteId); if(n) { n.bg = {...n.bg, ...bg}; applyNoteBg(n.bg); saveData(); closeModal('bg-modal'); } }
        function uploadNoteBg(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => compressImage(e.target.result, 1000, b64 => updateNoteBg({img: b64, color: ''})); r.readAsDataURL(input.files[0]); } }

        function openColorPicker(cmd) { currentColorAction = cmd; openModal('color-picker-modal'); }
        function applyColor(hex) { if(currentColorAction) exec(currentColorAction, hex); closeModal('color-picker-modal'); }

        // 导出长图与文档
        function exportLongImage(withBg) {
            closeModal('export-modal'); showToast('📸 正在渲染高清长图...');
            const wrapper = document.getElementById('editor-wrapper');
            const content = document.getElementById('editor-content');
            const title = document.getElementById('note-title').value || '无标题便签';
            
            // 创建临时克隆节点用于完美排版截图
            const clone = document.createElement('div');
            clone.style.cssText = `width: 600px; padding: 40px; font-family: ${appData.settings.fontFamily}; color: #1f2937; position: fixed; top: -9999px; left: 0;`;
            if(withBg && wrapper.style.backgroundImage) { clone.style.backgroundImage = wrapper.style.backgroundImage; clone.style.backgroundSize = 'cover'; }
            else if(withBg && wrapper.style.backgroundColor) { clone.style.backgroundColor = wrapper.style.backgroundColor; }
            else { clone.style.backgroundColor = '#ffffff'; }

            clone.innerHTML = `
                <div style="background:${withBg && wrapper.style.backgroundImage ? 'rgba(255,255,255,0.88)' : 'transparent'}; padding: 25px; border-radius: 12px;">
                    <h1 style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">${title}</h1>
                    <div style="line-height:${appData.settings.editorLineHeight}; font-size:16px;">${content.innerHTML}</div>
                    <div style="margin-top:40px; padding-top:15px; border-top:1px dashed #ccc; font-size:12px; color:#888; display:flex; justify-content:space-between;">
                        <span>${appData.settings.watermarkText}</span>
                        <span>${new Date().toLocaleDateString()}</span>
                    </div>
                </div>`;
            document.body.appendChild(clone);

            html2canvas(clone, { useCORS: true, scale: 2 }).then(canvas => {
                clone.remove();
                const a = document.createElement('a'); a.download = `${title}_长图.png`; a.href = canvas.toDataURL('image/png'); a.click();
            });
        }

        function exportTxt() {
            const title = document.getElementById('note-title').value || '便签';
            const txt = document.getElementById('editor-content').innerText;
            const blob = new Blob([`${title}\r\n\r\n${txt}`], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${title}.txt`; a.click();
            closeModal('export-modal');
        }

        function exportWord() {
            const title = document.getElementById('note-title').value || '便签';
            const html = `<html><head><meta charset='utf-8'></head><body><h1>${title}</h1>${document.getElementById('editor-content').innerHTML}</body></html>`;
            const blob = new Blob([html], { type: 'application/msword;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${title}.doc`; a.click();
            closeModal('export-modal');
        }

        // ================= 7. 全局设置中心与工具栏配置渲染 =================
        function openSettingsModal() { renderSettingsUI(); openModal('settings-modal'); }

        function renderSettingsUI() {
            const sidebar = document.getElementById('ms-sidebar');
            const content = document.getElementById('ms-content');
            
            sidebar.innerHTML = MEGA_SETTINGS_CONFIG.map(cat => `
                <div class="ms-nav ${cur.settingsTab === cat.id ? 'active' : ''}" onclick="cur.settingsTab='${cat.id}'; renderSettingsUI();">
                    <i data-lucide="${cat.icon}"></i> <span>${cat.name}</span>
                </div>`).join('');

            const activeCat = MEGA_SETTINGS_CONFIG.find(c => c.id === cur.settingsTab);
            if(activeCat) {
                content.innerHTML = activeCat.items.map(item => {
                    const val = appData.settings[item.key];
                    if(item.type === 'switch') {
                        return `<div class="ms-item"><div class="ms-item-info"><div class="ms-item-title">${item.label}</div></div>
                                <label class="switch"><input type="checkbox" ${val?'checked':''} onchange="updateGlobalSetting('${item.key}', this.checked)"><span class="slider"></span></label></div>`;
                    }
                    if(item.type === 'select') {
                        return `<div class="ms-item"><div class="ms-item-info"><div class="ms-item-title">${item.label}</div></div>
                                <select class="ms-control" onchange="updateGlobalSetting('${item.key}', this.value)">
                                ${item.options.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
                    }
                    if(item.type === 'text') {
                        return `<div class="ms-item"><div class="ms-item-info"><div class="ms-item-title">${item.label}</div></div>
                                <input type="text" class="ms-control" value="${val||''}" onchange="updateGlobalSetting('${item.key}', this.value)"></div>`;
                    }
                    if(item.type === 'action') {
                        return `<div class="ms-item" style="cursor:pointer;" onclick="(${item.action.toString()})()"><div class="ms-item-info"><div class="ms-item-title" style="color:var(--accent);font-weight:bold;">${item.label}</div></div>
                                <i data-lucide="chevron-right" style="width:18px;color:var(--text-sub);"></i></div>`;
                    }
                }).join('');
            }
            lucide.createIcons();
        }

        function updateGlobalSetting(key, val) {
            appData.settings[key] = val;
            saveData();
            applyAllSettingsToDOM();
            renderNotes();
            showToast('⚡ 设置已生效');
        }

        function backupData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `超级便签备份_${new Date().toLocaleDateString()}.json`; a.click();
        }

        function restoreBackup(input) {
            if(!input.files[0]) return;
            const r = new FileReader();
            r.onload = e => {
                try {
                    const d = JSON.parse(e.target.result);
                    if(d.notes && d.folders) { appData = d; saveData(); location.reload(); }
                    else alert('备份文件格式不正确');
                } catch(err) { alert('解析备份文件失败'); }
            };
            r.readAsText(input.files[0]);
        }

        function resetAllSettings() {
            if(confirm('确定要重置所有外观设置和工具栏顺序吗？（您的便签文字数据不会丢失）')) {
                localStorage.removeItem(DB_KEY);
                location.reload();
            }
        }

        // 工具栏渲染与拖拽同步
        function renderToolbar() {
            const con = document.getElementById('toolbar-container');
            con.innerHTML = appData.toolbar.filter(t => t.visible).map(t => {
                const core = ALL_TOOLS_REGISTRY[t.id];
                if(!core) return '';
                return `<button class="tool-btn" onclick="ALL_TOOLS_REGISTRY['${t.id}'].action()" title="${core.label}">
                            <i data-lucide="${core.icon}"></i>${t.text ? `<span>${core.label}</span>` : ''}
                        </button>`;
            }).join('');
            lucide.createIcons();
            renderToolbarSettings();
        }

        function renderToolbarSettings() {
            const list = document.getElementById('tb-config-list');
            list.innerHTML = appData.toolbar.map((t, idx) => {
                const core = ALL_TOOLS_REGISTRY[t.id];
                if(!core) return '';
                return `
                    <div class="tb-config-item" data-id="${t.id}">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <i data-lucide="grip-vertical" class="drag-handle"></i>
                            <i data-lucide="${core.icon}" style="width:18px; color:var(--accent);"></i>
                            <span style="font-size:0.9rem;">${core.label}</span>
                        </div>
                        <div style="display:flex; gap:14px; align-items:center;">
                            <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px;">文字 
                                <label class="switch"><input type="checkbox" ${t.text ? 'checked':''} onchange="updateTbConf(${idx}, 'text', this.checked)"><span class="slider"></span></label>
                            </label>
                            <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px; border-left:1px solid var(--border-solid); padding-left:10px;">启用 
                                <label class="switch"><input type="checkbox" ${t.visible ? 'checked':''} onchange="updateTbConf(${idx}, 'visible', this.checked)"><span class="slider"></span></label>
                            </label>
                        </div>
                    </div>`;
            }).join('');
            lucide.createIcons();
        }

        function updateTbConf(idx, key, val) { appData.toolbar[idx][key] = val; saveData(); renderToolbar(); }
        function syncToolbarConfig() {
            const items = document.querySelectorAll('.tb-config-item');
            const newArr = [];
            items.forEach(el => newArr.push(appData.toolbar.find(t => t.id === el.getAttribute('data-id'))));
            appData.toolbar = newArr; saveData();
        }

        function openModal(id) { const e = document.getElementById(id); e.style.display='flex'; setTimeout(()=>e.classList.add('active'),10); }
        function closeModal(id) { const e = document.getElementById(id); e.classList.remove('active'); setTimeout(()=>e.style.display='none',200); }
    </script>
</body>
</html>
