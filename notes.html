<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级便签 Pro</title>
    
    <!-- 引入外部库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入 ZeoSeven 字体 (以霞鹜文楷为例) -->
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/79/main/result.css">

    <style>
        :root {
            --bg-start: #f3f4f6;
            --bg-end: #e5e7eb;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-blur: blur(12px);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: rgba(255, 255, 255, 0.5);
            --border-solid: #d1d5db;
            --accent: #6366f1;
            --hover: rgba(99, 102, 241, 0.1);
            --editor-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --font-family: 'LXGW WenKai Screen', 'Segoe UI', sans-serif;
        }

        body.night-mode {
            --bg-start: #111827;
            --bg-end: #1f2937;
            --card-bg: rgba(31, 41, 55, 0.7);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --border-solid: #374151;
            --accent: #818cf8;
            --hover: rgba(255, 255, 255, 0.05);
            --editor-bg: #111827;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* 隐藏全局滚动条但保持可滚动 */
        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        /* 顶部导航 */
        .top-bar {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--card-bg); backdrop-filter: var(--card-blur);
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.2rem; }
        .nav-actions { display: flex; gap: 8px; }
        
        .btn-icon {
            background: transparent; border: 1px solid transparent; color: var(--text-main);
            padding: 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-icon:hover { background: var(--hover); }
        .btn-primary { background: var(--accent); color: white; border: none; }
        .btn-primary:hover { opacity: 0.9; }

        /* 主体布局 */
        .main-container {
            display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px; background: var(--card-bg); backdrop-filter: var(--card-blur);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-solid); }
        .folder-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        
        .folder-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 4px; transition: 0.2s; color: var(--text-main);
        }
        .folder-item:hover { background: var(--hover); }
        .folder-item.active { background: var(--accent); color: white; }
        .folder-count { font-size: 0.8rem; opacity: 0.8; }
        
        .sidebar-footer { padding: 10px; border-top: 1px solid var(--border-solid); }

        /* 内容区 */
        .content-area {
            flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden;
        }
        .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .layout-controls { display: flex; gap: 5px; background: var(--card-bg); padding: 5px; border-radius: 8px; }

        /* 便签网格 (支持多种布局，默认Grid) */
        .notes-container {
            flex: 1; overflow-y: auto; padding-bottom: 20px;
        }
        
        .layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; align-content: start; }
        .layout-list { display: flex; flex-direction: column; gap: 10px; }
        
        .note-card {
            background: var(--card-bg); backdrop-filter: var(--card-blur); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s;
            box-shadow: var(--shadow); position: relative; display: flex; flex-direction: column;
            height: 160px;
        }
        /* 修复悬浮问题，改用scale */
        .note-card:hover { transform: scale(1.02); border-color: var(--accent); }
        
        .layout-list .note-card { height: auto; flex-direction: row; align-items: center; gap: 15px; }
        
        .note-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .note-title { font-weight: bold; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .note-preview { font-size: 0.9rem; color: var(--text-sub); flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.5; }
        .layout-list .note-preview { -webkit-line-clamp: 1; flex: 2; margin-bottom: 0; }
        .note-meta { font-size: 0.8rem; color: var(--text-sub); margin-top: 10px; display: flex; justify-content: space-between; }
        
        /* 编辑器全屏模态 */
        .editor-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--editor-bg); z-index: 2000; display: none; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .editor-modal.show { display: flex; transform: translateY(0); }

        .editor-header {
            height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-solid); background: var(--editor-bg); z-index: 2001;
        }
        .editor-title-input { border: none; background: transparent; font-size: 1.2rem; font-weight: bold; color: var(--text-main); font-family: inherit; width: 50%; }

        /* 超级工具栏 */
        .editor-toolbar {
            padding: 8px 10px; background: var(--bg-start); border-bottom: 1px solid var(--border-solid);
            display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; align-items: center;
            z-index: 2001;
        }
        .tool-btn {
            background: transparent; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer;
            color: var(--text-main); display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
            min-width: 44px; transition: 0.2s;
        }
        .tool-btn:hover { background: var(--hover); }
        .tool-btn i { width: 18px; height: 18px; }
        .tool-btn span { font-size: 10px; }
        .tool-divider { width: 1px; height: 24px; background: var(--border-solid); margin: 0 4px; }
        
        .editor-body {
            flex: 1; position: relative; display: flex; justify-content: center; background-size: cover; background-position: center; overflow-y: auto;
        }
        #editor-content {
            width: 100%; max-width: 900px; padding: 40px; min-height: 100%;
            font-size: 1.1rem; line-height: 1.8; color: var(--text-main); outline: none;
            background: transparent;
        }
        
        /* 模态框通用系统 (确保层级高于编辑器) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 3000; display: none;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box {
            background: var(--editor-bg); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
            border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            transform: scale(0.95); transition: transform 0.2s; color: var(--text-main);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-sub); }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-solid); border-radius: 8px; background: transparent; color: inherit; font-family: inherit;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* 全局设置专属UI */
        .settings-layout { display: flex; height: 60vh; }
        .settings-sidebar { width: 140px; border-right: 1px solid var(--border-solid); overflow-y: auto; padding-right: 10px; }
        .settings-nav-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-size: 0.9rem; }
        .settings-nav-item.active { background: var(--hover); font-weight: bold; color: var(--accent); }
        .settings-content { flex: 1; padding-left: 20px; overflow-y: auto; }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-solid); }
        /* Switch UI */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; height: calc(100vh - 60px); z-index: 1000; }
            .sidebar.mobile-open { left: 0; }
            .editor-title-input { width: 100px; }
            .settings-layout { flex-direction: column; }
            .settings-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-solid); display: flex; padding-bottom: 10px; margin-bottom: 10px; }
            .settings-nav-item { white-space: nowrap; }
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <header class="top-bar">
        <div class="logo-area">
            <button class="btn-icon mobile-menu-btn" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
            <i data-lucide="book-open" style="color: var(--accent);"></i> 超级便签 Pro
        </div>
        <div class="nav-actions">
            <button class="btn-icon" onclick="toggleNightMode()" title="日夜切换"><i data-lucide="moon"></i></button>
            <button class="btn-icon" onclick="openModal('settings-modal')" title="全局设置"><i data-lucide="settings"></i></button>
        </div>
    </header>

    <!-- 主界面 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>便签夹</span>
                <button class="btn-icon" onclick="addFolder()"><i data-lucide="folder-plus"></i></button>
            </div>
            <ul class="folder-list" id="folder-list">
                <!-- JS 渲染目录 -->
            </ul>
            <div class="sidebar-footer">
                <div class="folder-item" onclick="switchFolder('trash')" id="folder-trash">
                    <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="trash-2" style="width:16px;"></i> 回收站</div>
                </div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content-area">
            <div class="content-header">
                <h2 id="current-folder-title">全部便签</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="layout-controls">
                        <button class="btn-icon" onclick="changeLayout('grid')" title="网格布局"><i data-lucide="layout-grid"></i></button>
                        <button class="btn-icon" onclick="changeLayout('list')" title="列表布局"><i data-lucide="list"></i></button>
                    </div>
                    <button class="btn-icon btn-primary" style="padding: 8px 16px;" onclick="createNote('text')">
                        <i data-lucide="plus"></i> 新建
                    </button>
                </div>
            </div>
            
            <div class="notes-container layout-grid" id="notes-grid">
                <!-- 便签卡片由 JS 渲染 -->
            </div>
        </main>
    </div>

    <!-- 全屏富文本编辑器 -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-header">
            <button class="btn-icon" onclick="closeEditor()"><i data-lucide="chevron-left"></i> 返回</button>
            <input type="text" id="note-title" class="editor-title-input" placeholder="输入标题...">
            <div style="display: flex; gap: 5px;">
                <button class="btn-icon" onclick="openModal('export-modal')" title="导出"><i data-lucide="download"></i></button>
                <button class="btn-icon" onclick="openModal('bg-modal')" title="背景"><i data-lucide="image"></i></button>
                <button class="btn-icon btn-primary" onclick="saveNote()"><i data-lucide="save"></i> 保存</button>
            </div>
        </div>

        <!-- 动态生成的超级工具栏 -->
        <div class="editor-toolbar" id="toolbar-container">
            <!-- JS 渲染 -->
        </div>

        <div class="editor-body" id="editor-wrapper">
            <div id="editor-content" contenteditable="true" placeholder="开始记录你的灵感..."></div>
        </div>
    </div>

    <!-- ================= 模态框组 ================= -->

    <!-- 全局设置模态框 -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 800px;">
            <div class="modal-title">全局设置 <button class="btn-icon" onclick="closeModal('settings-modal')"><i data-lucide="x"></i></button></div>
            <div class="settings-layout">
                <div class="settings-sidebar">
                    <div class="settings-nav-item active" onclick="switchSettingTab('general')">常规设置</div>
                    <div class="settings-nav-item" onclick="switchSettingTab('theme')">主题外观</div>
                    <div class="settings-nav-item" onclick="switchSettingTab('editor')">编辑器</div>
                    <div class="settings-nav-item" onclick="switchSettingTab('data')">数据备份</div>
                </div>
                <div class="settings-content" id="settings-content-area">
                    <!-- JS动态渲染设置项 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 背景设置模态框 -->
    <div id="bg-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">便签背景 <button class="btn-icon" onclick="closeModal('bg-modal')"><i data-lucide="x"></i></button></div>
            <div class="form-group">
                <label>纯色背景</label>
                <input type="color" id="bg-color-picker" class="form-control" onchange="updateBg({color: this.value, img: ''})">
            </div>
            <div class="form-group">
                <label>图片背景</label>
                <input type="file" id="bg-img-upload" class="form-control" accept="image/*" onchange="uploadBgImg(this)">
            </div>
            <div class="modal-actions">
                <button class="btn-icon" onclick="updateBg({color:'', img:''})">清除背景</button>
                <button class="btn-icon btn-primary" onclick="closeModal('bg-modal')">完成</button>
            </div>
        </div>
    </div>

    <!-- 导出模态框 -->
    <div id="export-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">导出便签 <button class="btn-icon" onclick="closeModal('export-modal')"><i data-lucide="x"></i></button></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn-icon" style="flex-direction: column; padding: 20px;" onclick="exportImage()"><i data-lucide="image" style="width:32px;height:32px;margin-bottom:10px;"></i>导出长图</button>
                <button class="btn-icon" style="flex-direction: column; padding: 20px;" onclick="exportTxt()"><i data-lucide="file-text" style="width:32px;height:32px;margin-bottom:10px;"></i>导出TXT</button>
                <button class="btn-icon" style="flex-direction: column; padding: 20px;" onclick="alert('PDF导出组件已预留')"><i data-lucide="file" style="width:32px;height:32px;margin-bottom:10px;"></i>导出PDF</button>
                <button class="btn-icon" style="flex-direction: column; padding: 20px;" onclick="alert('Docx导出组件已预留')"><i data-lucide="file-word" style="width:32px;height:32px;margin-bottom:10px;"></i>导出Word</button>
            </div>
        </div>
    </div>

    <!-- 文件上传辅助 (隐藏) -->
    <input type="file" id="sys-img-upload" hidden accept="image/*">

    <script>
        // ================= 核心架构与数据状态 =================
        const DB_KEY = 'super_notes_pro_data';
        
        // 初始数据结构设计 (支持文件夹无限嵌套)
        let appData = {
            folders: [
                { id: 'root', name: '全部便签', parentId: null },
            ],
            notes: [], // { id, title, content, folderId, createTime, updateTime, isDeleted, bg: {color, img} }
            settings: {
                nightMode: 'auto', layout: 'grid', fontFamily: 'LXGW WenKai Screen', fontSize: '1.1rem',
                toolbarText: true
            }
        };

        let currentState = {
            folderId: 'root',
            noteId: null,
            isNight: false
        };

        // ================= 超级工具栏引擎 =================
        // 定义工具栏所有能力，通过配置控制UI
        const TOOLBAR_CONFIG = [
            { id: 'save', icon: 'save', label: '保存', action: () => saveNote() },
            { id: 'undo', icon: 'undo-2', label: '撤销', action: () => exec('undo') },
            { id: 'redo', icon: 'redo-2', label: '重做', action: () => exec('redo') },
            { type: 'divider' },
            { id: 'bold', icon: 'bold', label: '加粗', action: () => exec('bold') },
            { id: 'italic', icon: 'italic', label: '斜体', action: () => exec('italic') },
            { id: 'underline', icon: 'underline', label: '下划线', action: () => exec('underline') },
            { id: 'strike', icon: 'strikethrough', label: '删除线', action: () => exec('strikeThrough') },
            { id: 'color', icon: 'palette', label: '字体颜色', action: () => alert('颜色组件载入中...') },
            { type: 'divider' },
            { id: 'h1', icon: 'heading-1', label: '大标题', action: () => exec('formatBlock', 'H1') },
            { id: 'h2', icon: 'heading-2', label: '小标题', action: () => exec('formatBlock', 'H2') },
            { id: 'align-left', icon: 'align-left', label: '左对齐', action: () => exec('justifyLeft') },
            { id: 'align-center', icon: 'align-center', label: '居中', action: () => exec('justifyCenter') },
            { id: 'indent', icon: 'indent', label: '缩进', action: () => exec('indent') },
            { id: 'ul', icon: 'list', label: '无序列表', action: () => exec('insertUnorderedList') },
            { id: 'ol', icon: 'list-ordered', label: '有序列表', action: () => exec('insertOrderedList') },
            { id: 'todo', icon: 'check-square', label: '待办', action: () => insertTodo() },
            { type: 'divider' },
            { id: 'image', icon: 'image-plus', label: '插图', action: () => document.getElementById('sys-img-upload').click() },
            { id: 'time', icon: 'clock', label: '时间', action: () => insertHtmlAtCursor(new Date().toLocaleString()) },
            { id: 'table', icon: 'table', label: '表格', action: () => alert('表格组件已预留') },
            { id: 'mindmap', icon: 'network', label: '导图', action: () => alert('思维导图组件接入中...') },
            { id: 'ocr', icon: 'scan-text', label: 'OCR', action: () => alert('图片转文字引擎准备中...') },
            { type: 'divider' },
            { id: 'setting', icon: 'settings-2', label: '排版', action: () => openModal('settings-modal') }
        ];

        // ================= 全局设置配置引擎 =================
        const SETTINGS_CONFIG = {
            general: [
                { id: 'autoSave', label: '自动保存', type: 'switch', value: true },
                { id: 'fontFamily', label: '全局字体', type: 'select', options: ['LXGW WenKai Screen', 'Segoe UI', 'System'], value: 'LXGW WenKai Screen' },
                { id: 'confirmDelete', label: '删除前二次确认', type: 'switch', value: true }
            ],
            theme: [
                { id: 'nightMode', label: '深色模式', type: 'select', options: ['auto', 'light', 'dark'], value: 'light' },
                { id: 'toolbarText', label: '工具栏显示文字', type: 'switch', value: true }
            ],
            editor: [
                { id: 'fontSize', label: '默认字号', type: 'select', options: ['0.9rem', '1.1rem', '1.3rem'], value: '1.1rem' },
                { id: 'lineHeight', label: '默认行距', type: 'select', options: ['1.5', '1.8', '2.0'], value: '1.8' }
            ]
        };

        // ================= 初始化与生命周期 =================
        window.onload = () => {
            loadData();
            renderSidebar();
            renderNotes();
            renderToolbar();
            lucide.createIcons();
            
            // 绑定图片上传
            document.getElementById('sys-img-upload').addEventListener('change', e => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = ev => exec('insertHTML', `<img src="${ev.target.result}" style="max-width:100%; border-radius:8px; margin:10px 0;">`);
                    reader.readAsDataURL(file);
                }
            });
        };

        function loadData() {
            try {
                const local = localStorage.getItem(DB_KEY);
                if(local) {
                    let parsed = JSON.parse(local);
                    appData.notes = parsed.notes || [];
                    appData.folders = parsed.folders || [{ id: 'root', name: '全部便签', parentId: null }];
                    appData.settings = {...appData.settings, ...parsed.settings};
                }
            } catch(e) { console.error('Data load error'); }
            
            if(appData.settings.nightMode === 'dark') toggleNightMode(true);
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(appData));
        }

        function triggerUIUpdate() {
            lucide.createIcons();
        }

        // ================= UI 渲染层 =================
        function renderSidebar() {
            const list = document.getElementById('folder-list');
            // 过滤有效文件夹 (这里可以写递归支持无限层级，精简版用一维展示+缩进模拟)
            const foldersHtml = appData.folders.map(f => {
                const count = appData.notes.filter(n => n.folderId === f.id && !n.isDeleted).length;
                const isActive = currentState.folderId === f.id ? 'active' : '';
                return `
                    <li class="folder-item ${isActive}" onclick="switchFolder('${f.id}')">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <i data-lucide="${f.id === 'root' ? 'inbox' : 'folder'}"></i> ${f.name}
                        </div>
                        <span class="folder-count">${count}</span>
                    </li>
                `;
            }).join('');
            
            list.innerHTML = foldersHtml;
            document.getElementById('folder-trash').classList.toggle('active', currentState.folderId === 'trash');
        }

        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            let notes = appData.notes;
            
            if(currentState.folderId === 'trash') {
                notes = notes.filter(n => n.isDeleted);
                document.getElementById('current-folder-title').innerText = '回收站';
            } else {
                notes = notes.filter(n => n.folderId === currentState.folderId && !n.isDeleted);
                const folder = appData.folders.find(f => f.id === currentState.folderId);
                document.getElementById('current-folder-title').innerText = folder ? folder.name : '全部便签';
            }

            notes.sort((a, b) => b.updateTime - a.updateTime);

            if(notes.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-sub);">
                    <i data-lucide="leaf" style="width:48px;height:48px;opacity:0.5;margin-bottom:10px;"></i>
                    <p>这里空空如也</p>
                </div>`;
                triggerUIUpdate();
                return;
            }

            grid.innerHTML = notes.map(n => `
                <div class="note-card" onclick="openNote('${n.id}')">
                    <div class="note-header">
                        <div class="note-title">${n.title || '无标题'}</div>
                        ${currentState.folderId === 'trash' ? 
                          `<button class="btn-icon" onclick="event.stopPropagation(); restoreNote('${n.id}')"><i data-lucide="refresh-cw"></i></button>` :
                          `<button class="btn-icon" onclick="event.stopPropagation(); deleteNote('${n.id}')"><i data-lucide="trash"></i></button>`
                        }
                    </div>
                    <div class="note-preview">${n.content.replace(/<[^>]+>/g, '') || '没有内容...'}</div>
                    <div class="note-meta">
                        <span>${new Date(n.updateTime).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
            
            triggerUIUpdate();
        }

        function renderToolbar() {
            const container = document.getElementById('toolbar-container');
            container.innerHTML = TOOLBAR_CONFIG.map(tool => {
                if(tool.type === 'divider') return `<div class="tool-divider"></div>`;
                return `
                    <button class="tool-btn" onclick="(${tool.action.toString()})()" title="${tool.label}">
                        <i data-lucide="${tool.icon}"></i>
                        ${appData.settings.toolbarText ? `<span>${tool.label}</span>` : ''}
                    </button>
                `;
            }).join('');
        }

        // ================= 业务逻辑层 =================
        function switchFolder(id) {
            currentState.folderId = id;
            renderSidebar();
            renderNotes();
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function addFolder() {
            const name = prompt("新建便签夹名称：");
            if(name && name.trim()) {
                appData.folders.push({ id: 'f_'+Date.now(), name: name.trim(), parentId: 'root' });
                saveData();
                renderSidebar();
            }
        }

        function deleteNote(id) {
            if(appData.settings.confirmDelete && !confirm('确认删除到回收站吗？')) return;
            const note = appData.notes.find(n => n.id === id);
            if(note) {
                note.isDeleted = true;
                saveData();
                renderSidebar();
                renderNotes();
            }
        }

        function restoreNote(id) {
            const note = appData.notes.find(n => n.id === id);
            if(note) { note.isDeleted = false; saveData(); renderSidebar(); renderNotes(); }
        }

        function changeLayout(type) {
            const grid = document.getElementById('notes-grid');
            grid.className = `notes-container layout-${type}`;
            appData.settings.layout = type;
            saveData();
        }

        // ================= 编辑器核心 =================
        function createNote() {
            const newNote = {
                id: 'n_'+Date.now(), title: '', content: '',
                folderId: currentState.folderId === 'trash' ? 'root' : currentState.folderId,
                createTime: Date.now(), updateTime: Date.now(), isDeleted: false,
                bg: {color:'', img:''}
            };
            appData.notes.push(newNote);
            saveData();
            openNote(newNote.id);
        }

        function openNote(id) {
            const note = appData.notes.find(n => n.id === id);
            if(!note) return;
            currentState.noteId = id;
            
            document.getElementById('note-title').value = note.title;
            document.getElementById('editor-content').innerHTML = note.content;
            applyEditorBg(note.bg);
            
            const modal = document.getElementById('editor-modal');
            modal.style.display = 'flex';
            // 延迟添加类以触发动画
            setTimeout(() => modal.classList.add('show'), 10);
            triggerUIUpdate();
        }

        function saveNote() {
            const note = appData.notes.find(n => n.id === currentState.noteId);
            if(!note) return;
            note.title = document.getElementById('note-title').value;
            note.content = document.getElementById('editor-content').innerHTML;
            note.updateTime = Date.now();
            saveData();
            renderSidebar();
            renderNotes();
        }

        function closeEditor() {
            saveNote();
            const modal = document.getElementById('editor-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        // 富文本底层方法
        function exec(cmd, val=null) { document.execCommand(cmd, false, val); document.getElementById('editor-content').focus(); }
        function insertHtmlAtCursor(html) { exec('insertHTML', html); }
        function insertTodo() {
            insertHtmlAtCursor(`<div style="display:flex;align-items:center;gap:8px;margin:4px 0;"><input type="checkbox" style="width:16px;height:16px;"><span>待办事项...</span></div>`);
        }

        // ================= 背景与外观 =================
        function applyEditorBg(bg) {
            const wrapper = document.getElementById('editor-wrapper');
            const editor = document.getElementById('editor-content');
            if(!bg) { wrapper.style.background = ''; editor.style.background = 'transparent'; return; }
            
            wrapper.style.backgroundColor = bg.color || '';
            wrapper.style.backgroundImage = bg.img ? `url(${bg.img})` : '';
            // 如果有背景图片，内容区给一点白色半透明底保证文字可读性
            editor.style.backgroundColor = bg.img ? 'rgba(255,255,255,0.85)' : 'transparent';
        }

        function updateBg(bgData) {
            const note = appData.notes.find(n => n.id === currentState.noteId);
            if(note) { note.bg = {...note.bg, ...bgData}; applyEditorBg(note.bg); saveData(); }
        }

        function uploadBgImg(input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => updateBg({img: e.target.result, color: ''});
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleNightMode(force) {
            currentState.isNight = force !== undefined ? force : !currentState.isNight;
            document.body.classList.toggle('night-mode', currentState.isNight);
            appData.settings.nightMode = currentState.isNight ? 'dark' : 'light';
            saveData();
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); }

        // ================= 模态框与设置引擎 =================
        function openModal(id) { 
            const el = document.getElementById(id);
            el.style.display = 'flex';
            setTimeout(() => el.classList.add('active'), 10);
            if(id === 'settings-modal') renderSettings();
        }
        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('active');
            setTimeout(() => el.style.display = 'none', 200);
        }

        function renderSettings(tab = 'general') {
            const area = document.getElementById('settings-content-area');
            const configs = SETTINGS_CONFIG[tab];
            if(!configs) { area.innerHTML = '<p>开发中...</p>'; return; }
            
            area.innerHTML = configs.map(c => {
                if(c.type === 'switch') {
                    return `<div class="setting-row">
                        <span>${c.label}</span>
                        <label class="switch"><input type="checkbox" ${appData.settings[c.id] ? 'checked' : ''} onchange="updateSetting('${c.id}', this.checked)"><span class="slider"></span></label>
                    </div>`;
                }
                if(c.type === 'select') {
                    return `<div class="setting-row" style="flex-direction:column; align-items:flex-start; gap:10px;">
                        <span>${c.label}</span>
                        <select class="form-control" onchange="updateSetting('${c.id}', this.value)">
                            ${c.options.map(o => `<option value="${o}" ${appData.settings[c.id] === o ? 'selected':''}>${o}</option>`).join('')}
                        </select>
                    </div>`;
                }
            }).join('');
        }

        function switchSettingTab(tab) {
            document.querySelectorAll('.settings-nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderSettings(tab);
        }

        function updateSetting(key, val) {
            appData.settings[key] = val;
            saveData();
            if(key === 'toolbarText') renderToolbar();
            if(key === 'nightMode') toggleNightMode(val === 'dark');
            triggerUIUpdate();
        }

        // ================= 导出引擎 =================
        function exportImage() {
            closeModal('export-modal');
            const target = document.getElementById('editor-wrapper');
            // 临时修改样式以导出全图
            const originalHeight = target.style.height;
            target.style.height = 'auto';
            
            html2canvas(target, { useCORS: true, scale: 2 }).then(canvas => {
                target.style.height = originalHeight;
                const link = document.createElement('a');
                link.download = `便签_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportTxt() {
            const title = document.getElementById('note-title').value || '无标题';
            const content = document.getElementById('editor-content').innerText;
            const blob = new Blob([`${title}\n\n${content}`], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${title}.txt`;
            link.click();
            closeModal('export-modal');
        }

    </script>
</body>
</html>
