<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级便签 Pro Max</title>
    
    <!-- CDN 依赖 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/79/main/result.css">

    <style>
        :root {
            --bg-start: #f3f4f6; --bg-end: #e5e7eb;
            --card-bg: rgba(255, 255, 255, 0.7); --card-blur: blur(12px);
            --text-main: #1f2937; --text-sub: #6b7280;
            --border: rgba(255, 255, 255, 0.5); --border-solid: #d1d5db;
            --accent: #6366f1; --hover: rgba(99, 102, 241, 0.1);
            --editor-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --font-family: 'LXGW WenKai Screen', sans-serif;
        }

        body.night-mode {
            --bg-start: #111827; --bg-end: #1f2937;
            --card-bg: rgba(31, 41, 55, 0.7);
            --text-main: #f9fafb; --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08); --border-solid: #374151;
            --accent: #818cf8; --hover: rgba(255, 255, 255, 0.05);
            --editor-bg: #111827; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
        }

        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            font-family: var(--font-family); background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.3s;
        }

        /* 顶栏 */
        .top-bar {
            height: 60px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: var(--card-bg); backdrop-filter: var(--card-blur);
            border-bottom: 1px solid var(--border); z-index: 100;
        }
        .btn-icon {
            background: transparent; border: 1px solid transparent; color: var(--text-main); text-decoration: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; font-family: inherit;
        }
        .btn-icon:hover { background: var(--hover); }
        .btn-primary { background: var(--accent); color: white; }

        /* 主体 */
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }
        
        /* 侧边栏（支持树形） */
        .sidebar {
            width: 260px; background: var(--card-bg); backdrop-filter: var(--card-blur);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-solid); }
        .folder-list { flex: 1; overflow-y: auto; padding: 10px; }
        .folder-item {
            padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 2px; transition: 0.2s; color: var(--text-main);
        }
        .folder-item:hover { background: var(--hover); }
        .folder-item.active { background: var(--accent); color: white; }
        .folder-children { margin-left: 15px; border-left: 1px dashed var(--border-solid); padding-left: 5px; }
        .folder-add-btn { opacity: 0; transition: 0.2s; padding: 2px; border-radius: 4px; }
        .folder-item:hover .folder-add-btn { opacity: 1; }
        .folder-add-btn:hover { background: rgba(0,0,0,0.1); }

        /* 内容区 & 布局系统 */
        .content-area { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        .notes-container { flex: 1; overflow-y: auto; padding-bottom: 20px; }
        
        /* -- 布局方案 -- */
        .layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; align-content: start; }
        .layout-waterfall { column-count: 3; column-gap: 16px; }
        @media(max-width:900px){ .layout-waterfall { column-count: 2; } }
        .layout-waterfall .note-card { break-inside: avoid; margin-bottom: 16px; height: auto; }
        .layout-default { display: flex; flex-direction: column; gap: 12px; }
        .layout-default .note-card { height: auto; }
        .layout-single-line .note-card { height: auto; padding: 10px 15px; flex-direction: row; align-items: center; gap: 15px; }
        .layout-single-line .note-preview { display: none; }
        .layout-image-text { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .layout-image-text .note-card { flex-direction: row; height: 120px; }
        .layout-timeline { border-left: 2px solid var(--accent); margin-left: 20px; padding-left: 20px; display: flex; flex-direction: column; gap: 20px; }
        .layout-timeline .note-card { position: relative; height: auto; overflow: visible; }
        .layout-timeline .note-card::before { content:''; position:absolute; left:-27px; top:20px; width:12px; height:12px; background:var(--accent); border-radius:50%; box-shadow:0 0 0 4px var(--card-bg); }

        .note-card {
            background: var(--card-bg); backdrop-filter: var(--card-blur); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; height: 160px;
        }
        .note-card:hover { transform: scale(1.02); border-color: var(--accent); box-shadow: var(--shadow); }
        .note-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-preview { font-size: 0.9rem; color: var(--text-sub); flex: 2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.5; }
        
        /* 下拉菜单 */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; background: var(--card-bg); backdrop-filter: var(--card-blur); min-width: 140px; box-shadow: var(--shadow); border-radius: 8px; border: 1px solid var(--border); z-index: 1000; padding: 5px 0; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: var(--text-main); padding: 10px 15px; text-decoration: none; display: block; cursor: pointer; font-size: 0.9rem; }
        .dropdown-content a:hover { background: var(--hover); }

        /* 编辑器模态 */
        .editor-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--editor-bg);
            z-index: 2000; display: none; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .editor-modal.show { display: flex; transform: translateY(0); }
        .editor-header { height: 60px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-solid); }
        .editor-title-input { border: none; background: transparent; font-size: 1.2rem; font-weight: bold; color: inherit; font-family: inherit; width: 40%; }
        
        /* 强大的工具栏容器 */
        .toolbar-wrapper { display: flex; border-bottom: 1px solid var(--border-solid); background: var(--bg-start); position: relative; }
        .editor-toolbar { flex: 1; display: flex; gap: 4px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; scroll-behavior: smooth; }
        .toolbar-settings-btn { width: 50px; display: flex; justify-content: center; align-items: center; background: var(--bg-start); border-left: 1px solid var(--border-solid); box-shadow: -4px 0 10px rgba(0,0,0,0.05); z-index: 10; cursor: pointer; }
        .toolbar-settings-btn:hover { color: var(--accent); }
        
        .tool-btn {
            background: transparent; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text-main);
            display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; transition: 0.2s; font-family: inherit;
        }
        .tool-btn:hover { background: var(--hover); }
        .tool-btn i { width: 18px; height: 18px; }
        .tool-btn span { font-size: 10px; margin-top: 2px; }
        
        #editor-wrapper { flex: 1; overflow-y: auto; display: flex; justify-content: center; background-size: cover; background-position: center; }
        #editor-content { width: 100%; max-width: 900px; padding: 40px; min-height: 100%; font-size: 1.1rem; line-height: 1.8; outline: none; background: transparent; }

        /* 模态框系统 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 3000; display: none; justify-content: center; align-items: center; opacity: 0; transition: 0.2s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box { background: var(--editor-bg); width: 90%; max-width: 500px; max-height: 85vh; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px rgba(0,0,0,0.15); overflow-y: auto; }
        .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        /* 工具栏配置拖拽UI */
        .tb-config-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--border-solid); margin-bottom: 8px; border-radius: 8px; background: var(--card-bg); }
        .tb-config-left { display: flex; align-items: center; gap: 10px; }
        .drag-handle { cursor: grab; color: var(--text-sub); }
        .drag-handle:active { cursor: grabbing; }

        /* 开关组件 */
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <header class="top-bar">
        <div style="display: flex; gap: 15px; align-items: center;">
            <!-- 新增返回首页按钮 -->
            <a href="index.html" class="btn-icon" style="color: var(--accent); font-weight:bold;">
                <i data-lucide="home"></i> 返回首页
            </a>
            <div style="font-weight: bold; font-size: 1.2rem; border-left: 2px solid var(--border-solid); padding-left: 15px;">超级便签</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-icon" onclick="toggleNightMode()" title="日夜切换"><i data-lucide="moon"></i></button>
            <button class="btn-icon" onclick="openModal('settings-modal')" title="全局设置"><i data-lucide="settings"></i></button>
        </div>
    </header>

    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>便签夹</span>
                <button class="btn-icon" style="padding:4px" onclick="addFolder('root')"><i data-lucide="folder-plus"></i></button>
            </div>
            <div class="folder-list" id="folder-list"></div>
            <div style="padding: 10px; border-top: 1px solid var(--border-solid);">
                <div class="folder-item" onclick="switchFolder('trash')" id="folder-trash">
                    <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="trash-2" style="width:16px;"></i> 回收站</div>
                </div>
            </div>
        </aside>

        <!-- 内容区 -->
        <main class="content-area">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="current-folder-title">全部便签</h2>
                <div style="display: flex; gap: 10px;">
                    <!-- 聚合多布局按钮 -->
                    <div class="dropdown">
                        <button class="btn-icon"><i data-lucide="layout"></i> 布局视图</button>
                        <div class="dropdown-content">
                            <a onclick="changeLayout('grid')"><i data-lucide="layout-grid" style="width:14px; margin-right:5px"></i>网格</a>
                            <a onclick="changeLayout('waterfall')"><i data-lucide="align-justify" style="width:14px; margin-right:5px"></i>瀑布流</a>
                            <a onclick="changeLayout('image-text')"><i data-lucide="image" style="width:14px; margin-right:5px"></i>图文</a>
                            <a onclick="changeLayout('timeline')"><i data-lucide="clock" style="width:14px; margin-right:5px"></i>时间轴</a>
                            <a onclick="changeLayout('default')"><i data-lucide="list" style="width:14px; margin-right:5px"></i>默认列表</a>
                            <a onclick="changeLayout('single-line')"><i data-lucide="minus" style="width:14px; margin-right:5px"></i>单行极简</a>
                        </div>
                    </div>
                    <button class="btn-icon btn-primary" onclick="createNote()"><i data-lucide="plus"></i> 新建</button>
                </div>
            </div>
            <div class="notes-container layout-grid" id="notes-grid"></div>
        </main>
    </div>

    <!-- 编辑器全屏 -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-header">
            <button class="btn-icon" onclick="closeEditor()"><i data-lucide="chevron-left"></i> 返回</button>
            <input type="text" id="note-title" class="editor-title-input" placeholder="输入标题...">
            <div style="display:flex; gap:5px;">
                <button class="btn-icon" onclick="openModal('bg-modal')" title="背景"><i data-lucide="image"></i></button>
            </div>
        </div>

        <div class="toolbar-wrapper">
            <div class="editor-toolbar" id="toolbar-container"></div>
            <!-- 固定在最右侧的设置按钮 -->
            <div class="toolbar-settings-btn" onclick="openModal('tb-settings-modal')">
                <i data-lucide="settings-2"></i>
            </div>
        </div>

        <div id="editor-wrapper">
            <div id="editor-content" contenteditable="true" placeholder="开始记录..."></div>
        </div>
    </div>

    <!-- ================= 模态框区 ================= -->
    
    <!-- 工具栏高级设置模态框 -->
    <div id="tb-settings-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px;">
            <div class="modal-title">自定义工具栏 <button class="btn-icon" onclick="closeModal('tb-settings-modal')"><i data-lucide="x"></i></button></div>
            <p style="font-size:0.9rem; color:var(--text-sub); margin-bottom:15px;">拖动左侧手柄排序，控制功能开关与文字显示。</p>
            <div id="tb-config-list" style="max-height: 50vh; overflow-y: auto;">
                <!-- JS 渲染 -->
            </div>
        </div>
    </div>

    <!-- 背景设置 -->
    <div id="bg-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">便签背景 <button class="btn-icon" onclick="closeModal('bg-modal')"><i data-lucide="x"></i></button></div>
            <div style="margin-bottom:15px;">
                <label>纯色背景</label>
                <input type="color" onchange="updateBg({color: this.value, img: ''})" style="width:100%; height:40px; margin-top:5px;">
            </div>
            <div style="margin-bottom:15px;">
                <label>图片背景 (自动压缩防崩溃)</label>
                <input type="file" accept="image/*" onchange="uploadBgImg(this)" style="display:block; margin-top:5px;">
            </div>
            <div style="text-align:right;">
                <button class="btn-icon" onclick="updateBg({color:'', img:''})">清除背景</button>
            </div>
        </div>
    </div>

    <!-- 全局设置占位 -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">全局设置 <button class="btn-icon" onclick="closeModal('settings-modal')"><i data-lucide="x"></i></button></div>
            <div style="margin-bottom:15px;">
                <label>全局字体</label>
                <select id="font-select" onchange="changeFont(this.value)" style="width:100%; padding:8px; margin-top:5px; border-radius:6px;">
                    <option value="'LXGW WenKai Screen', sans-serif">霞鹜文楷 (当前)</option>
                    <option value="'Segoe UI', Roboto, sans-serif">现代黑体</option>
                    <option value="'Courier New', monospace">等宽代码体</option>
                </select>
            </div>
            <p style="color:var(--text-sub); font-size:0.9rem;">更多几百项设置后续接口已预留，由于篇幅先展示核心。</p>
        </div>
    </div>

    <!-- 隐藏系统文件域 -->
    <input type="file" id="sys-img-upload" hidden accept="image/*">

    <script>
        // ================= 1. 核心字典与底层配置 =================
        const DB_KEY = 'super_notes_v3';

        // 注册所有 50+ 工具栏能力
        const ALL_TOOLS_REGISTRY = {
            save: { icon: 'save', label: '立即保存', action: () => saveNote() },
            toTop: { icon: 'arrow-up-to-line', label: '滑到顶部', action: () => document.getElementById('editor-wrapper').scrollTop = 0 },
            toBottom: { icon: 'arrow-down-to-line', label: '滑到底部', action: () => { const w = document.getElementById('editor-wrapper'); w.scrollTop = w.scrollHeight; } },
            undo: { icon: 'undo-2', label: '撤回', action: () => exec('undo') },
            redo: { icon: 'redo-2', label: '反撤回', action: () => exec('redo') },
            indentFirst: { icon: 'indent', label: '首段缩进', action: () => exec('insertHTML', '&nbsp;&nbsp;&nbsp;&nbsp;') },
            findReplace: { icon: 'replace', label: '查找替换', action: () => alert('呼出查找替换面板') },
            search: { icon: 'search', label: '搜索', action: () => alert('全局搜索功能') },
            bold: { icon: 'bold', label: '加粗', action: () => exec('bold') },
            ol: { icon: 'list-ordered', label: '有序列表', action: () => exec('insertOrderedList') },
            ul: { icon: 'list', label: '无序列表', action: () => exec('insertUnorderedList') },
            alignCenter: { icon: 'align-center', label: '居中', action: () => exec('justifyCenter') },
            fontSize: { icon: 'type', label: '文字大小', action: () => exec('fontSize', prompt('输入字号1-7','3')) },
            heading: { icon: 'heading', label: '标题', action: () => exec('formatBlock', 'H2') },
            italic: { icon: 'italic', label: '倾斜', action: () => exec('italic') },
            alignRight: { icon: 'align-right', label: '右对齐', action: () => exec('justifyRight') },
            formatClear: { icon: 'eraser', label: '格式化', action: () => exec('removeFormat') },
            todo: { icon: 'check-square', label: '待办', action: () => exec('insertHTML', '<input type="checkbox" style="margin-right:5px;">') },
            bgHighlight: { icon: 'highlighter', label: '文字背景色', action: () => exec('hiliteColor', '#ffff00') },
            nameHelper: { icon: 'venetian-mask', label: '取名助手', action: () => alert('打开取名AI') },
            insertTime: { icon: 'clock', label: '快捷时间', action: () => exec('insertHTML', new Date().toLocaleString()) },
            insertImage: { icon: 'image-plus', label: '插入图片', action: () => document.getElementById('sys-img-upload').click() },
            alignLeft: { icon: 'align-left', label: '左对齐', action: () => exec('justifyLeft') },
            underline: { icon: 'underline', label: '下划线', action: () => exec('underline') },
            copyAll: { icon: 'copy', label: '一键复制', action: () => { navigator.clipboard.writeText(document.getElementById('editor-content').innerText); alert('已复制'); } },
            mindmap: { icon: 'network', label: '思维导图', action: () => alert('导图引擎挂载区') },
            fontColor: { icon: 'palette', label: '文字颜色', action: () => exec('foreColor', '#ff0000') },
            colorMark: { icon: 'tag', label: '颜色标记', action: () => alert('标记功能') },
            formatPainter: { icon: 'paint-roller', label: '格式刷', action: () => alert('格式刷已启用') },
            hr: { icon: 'minus', label: '分割线', action: () => exec('insertHorizontalRule') },
            prevNote: { icon: 'chevron-up', label: '上一篇', action: () => alert('切换上一篇') },
            nextNote: { icon: 'chevron-down', label: '下一篇', action: () => alert('切换下一篇') },
            bgImage: { icon: 'wallpaper', label: '背景图片', action: () => openModal('bg-modal') },
            delParagraph: { icon: 'delete', label: '删除段落', action: () => exec('delete') },
            qrcode: { icon: 'qr-code', label: '插入二维码', action: () => alert('二维码生成器') },
            moveDown: { icon: 'arrow-down', label: '段落下移', action: () => alert('下移选中') },
            moveUp: { icon: 'arrow-up', label: '段落上移', action: () => alert('上移选中') },
            selectParagraph: { icon: 'text-cursor-input', label: '选中段落', action: () => alert('全选段落') },
            strike: { icon: 'strikethrough', label: '删除线', action: () => exec('strikeThrough') },
            symbol: { icon: 'pi', label: '插入符号', action: () => alert('符号面板') },
            location: { icon: 'map-pin', label: '快捷地点', action: () => exec('insertHTML', '📍未知地点') },
            table: { icon: 'table', label: '插入表格', action: () => alert('表格面板') },
            tts: { icon: 'mic', label: '语音合成', action: () => alert('调用TTS朗读') },
            ocr: { icon: 'scan-text', label: '图转文字', action: () => alert('开启OCR扫描') },
            reminder: { icon: 'bell', label: '文字提醒', action: () => alert('添加到日程') },
            moveFolder: { icon: 'folder-input', label: '移动便签夹', action: () => alert('弹窗选择移动位置') },
            pasteAll: { icon: 'clipboard-paste', label: '一键粘贴', action: () => exec('paste') },
            s2t: { icon: 'languages', label: '繁简转换', action: () => alert('繁简转换引擎') },
            lineSpace: { icon: 'arrow-up-down', label: '行间距', action: () => document.getElementById('editor-content').style.lineHeight = '2' },
            marginSet: { icon: 'maximize', label: '边距设置', action: () => document.getElementById('editor-content').style.padding = '60px' }
        };

        // 默认启用的核心工具（其它的在设置中关着）
        const DEFAULT_TOOLBAR = ['save','undo','redo','bold','italic','underline','alignLeft','alignCenter','todo','insertImage','bgImage'];

        let appData = {
            folders: [{ id: 'root', name: '全部便签', parentId: null }],
            notes: [],
            settings: { layout: 'grid', fontFamily: "'LXGW WenKai Screen', sans-serif" },
            toolbar: [] // 工具栏配置数组
        };
        let cur = { folderId: 'root', noteId: null };

        // ================= 2. 生命周期与初始化 =================
        window.onload = () => {
            loadData();
            applyGlobalFont();
            renderSidebar();
            renderNotes();
            renderToolbar();
            lucide.createIcons();
            
            // 初始化工具栏拖拽设置
            new Sortable(document.getElementById('tb-config-list'), {
                handle: '.drag-handle', animation: 150,
                onEnd: () => { syncToolbarConfig(); renderToolbar(); }
            });

            // 图片插入压缩逻辑
            document.getElementById('sys-img-upload').addEventListener('change', e => {
                const f = e.target.files[0];
                if(f) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        compressImage(ev.target.result, 800, base64 => {
                            exec('insertHTML', `<img src="${base64}" style="max-width:100%; border-radius:8px;">`);
                        });
                    };
                    reader.readAsDataURL(f);
                }
            });
        };

        function loadData() {
            try {
                const l = localStorage.getItem(DB_KEY);
                if(l) {
                    const d = JSON.parse(l);
                    appData.folders = d.folders || appData.folders;
                    appData.notes = d.notes || [];
                    appData.settings = {...appData.settings, ...d.settings};
                    appData.toolbar = d.toolbar || [];
                }
            } catch(e) {}
            
            // 初始化工具栏配置：如果没数据，则初始化全量数据
            if(appData.toolbar.length === 0) {
                appData.toolbar = Object.keys(ALL_TOOLS_REGISTRY).map(key => ({
                    id: key, visible: DEFAULT_TOOLBAR.includes(key), text: true
                }));
            }
            if(appData.settings.layout) changeLayout(appData.settings.layout, false);
        }

        function saveData() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(appData));
                return true;
            } catch(e) {
                alert("⚠️ 保存失败：浏览器存储空间已满(通常是因为图片过大)。系统已拦截崩溃，请删除部分图片后重试！");
                return false;
            }
        }

        // 图片压缩引擎 (防止存储爆满核心)
        function compressImage(base64Str, maxWidth, callback) {
            const img = new Image();
            img.onload = () => {
                const cvs = document.createElement('canvas');
                let w = img.width, h = img.height;
                if(w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                cvs.width = w; cvs.height = h;
                cvs.getContext('2d').drawImage(img, 0, 0, w, h);
                callback(cvs.toDataURL('image/jpeg', 0.6)); // 压缩至60%质量
            };
            img.src = base64Str;
        }

        // ================= 3. 字体与布局 =================
        function applyGlobalFont() {
            document.documentElement.style.setProperty('--font-family', appData.settings.fontFamily);
        }
        function changeFont(val) {
            appData.settings.fontFamily = val;
            applyGlobalFont();
            saveData();
        }
        function changeLayout(type, save=true) {
            document.getElementById('notes-grid').className = `notes-container layout-${type}`;
            if(save) { appData.settings.layout = type; saveData(); }
        }

        // ================= 4. 树形便签夹系统 =================
        function renderSidebar() {
            const list = document.getElementById('folder-list');
            list.innerHTML = buildFolderTree('root', 0);
            lucide.createIcons();
            document.getElementById('folder-trash').classList.toggle('active', cur.folderId === 'trash');
        }

        function buildFolderTree(parentId, level) {
            let html = '';
            const children = appData.folders.filter(f => f.parentId === parentId);
            if(parentId === 'root') { // 渲染Root自身
                const r = appData.folders.find(x => x.id === 'root');
                const cnt = appData.notes.filter(n=>n.folderId==='root' && !n.isDeleted).length;
                html += `
                    <div class="folder-item ${cur.folderId==='root'?'active':''}" onclick="switchFolder('root')">
                        <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="inbox"></i> ${r.name} (${cnt})</div>
                        <div class="folder-add-btn" onclick="event.stopPropagation(); addFolder('root')" title="新建子文件夹"><i data-lucide="plus" style="width:14px;height:14px"></i></div>
                    </div>
                `;
            }
            
            children.forEach(f => {
                const cnt = appData.notes.filter(n=>n.folderId===f.id && !n.isDeleted).length;
                html += `
                    <div class="folder-children" style="margin-left: ${level>0 ? '15px' : '0'};">
                        <div class="folder-item ${cur.folderId===f.id?'active':''}" onclick="switchFolder('${f.id}')">
                            <div style="display:flex; align-items:center; gap:8px;"><i data-lucide="folder"></i> ${f.name} (${cnt})</div>
                            <div class="folder-add-btn" onclick="event.stopPropagation(); addFolder('${f.id}')" title="新建子文件夹"><i data-lucide="plus" style="width:14px;height:14px"></i></div>
                        </div>
                        ${buildFolderTree(f.id, level + 1)}
                    </div>
                `;
            });
            return html;
        }

        function switchFolder(id) { cur.folderId = id; renderSidebar(); renderNotes(); }
        
        function addFolder(parentId) {
            const name = prompt("输入子便签夹名称：");
            if(name && name.trim()) {
                appData.folders.push({ id: 'f_'+Date.now(), name: name.trim(), parentId: parentId });
                saveData(); renderSidebar();
            }
        }

        // ================= 5. 便签内容管理 =================
        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            let nts = cur.folderId === 'trash' ? appData.notes.filter(n => n.isDeleted) : appData.notes.filter(n => n.folderId === cur.folderId && !n.isDeleted);
            
            const f = appData.folders.find(x => x.id === cur.folderId);
            document.getElementById('current-folder-title').innerText = cur.folderId === 'trash' ? '回收站' : (f?f.name:'');

            grid.innerHTML = nts.map(n => `
                <div class="note-card" onclick="openNote('${n.id}')">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <div class="note-title">${n.title || '无标题'}</div>
                        ${cur.folderId === 'trash' 
                          ? `<button class="btn-icon" style="padding:2px;" onclick="event.stopPropagation(); restoreNote('${n.id}')"><i data-lucide="refresh-cw" style="width:16px;"></i></button>`
                          : `<button class="btn-icon" style="padding:2px;" onclick="event.stopPropagation(); deleteNote('${n.id}')"><i data-lucide="trash" style="width:16px;"></i></button>`}
                    </div>
                    <div class="note-preview">${n.content.replace(/<[^>]+>/g, '') || '空'}</div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteNote(id) { const n = appData.notes.find(x=>x.id===id); if(n) { n.isDeleted = true; saveData(); renderSidebar(); renderNotes(); } }
        function restoreNote(id) { const n = appData.notes.find(x=>x.id===id); if(n) { n.isDeleted = false; saveData(); renderSidebar(); renderNotes(); } }

        function createNote() {
            const id = 'n_'+Date.now();
            appData.notes.push({ id, title: '', content: '', folderId: cur.folderId==='trash'?'root':cur.folderId, isDeleted: false, bg: {color:'', img:''} });
            saveData(); openNote(id);
        }

        function openNote(id) {
            const n = appData.notes.find(x => x.id === id);
            if(!n) return;
            cur.noteId = id;
            document.getElementById('note-title').value = n.title;
            document.getElementById('editor-content').innerHTML = n.content;
            applyBg(n.bg);
            const mod = document.getElementById('editor-modal');
            mod.style.display = 'flex'; setTimeout(() => mod.classList.add('show'), 10);
        }

        function saveNote() {
            const n = appData.notes.find(x => x.id === cur.noteId);
            if(n) {
                n.title = document.getElementById('note-title').value;
                n.content = document.getElementById('editor-content').innerHTML;
                if(saveData()) { renderSidebar(); renderNotes(); return true; }
                return false;
            }
            return true;
        }

        function closeEditor() {
            if(saveNote()) { // 只有保存成功(没爆满)才退出
                const mod = document.getElementById('editor-modal');
                mod.classList.remove('show'); setTimeout(() => mod.style.display = 'none', 300);
            }
        }
        function exec(cmd, val=null) { document.execCommand(cmd, false, val); document.getElementById('editor-content').focus(); }

        // ================= 6. 超级工具栏引擎 =================
        function renderToolbar() {
            const con = document.getElementById('toolbar-container');
            // 按配置数组顺序过滤并渲染
            con.innerHTML = appData.toolbar.filter(t => t.visible).map(t => {
                const core = ALL_TOOLS_REGISTRY[t.id];
                if(!core) return '';
                return `
                    <button class="tool-btn" onclick="ALL_TOOLS_REGISTRY['${t.id}'].action()" title="${core.label}">
                        <i data-lucide="${core.icon}"></i>
                        ${t.text ? `<span>${core.label}</span>` : ''}
                    </button>
                `;
            }).join('');
            lucide.createIcons();
            renderToolbarSettings(); // 同步更新设置面板
        }

        function renderToolbarSettings() {
            const list = document.getElementById('tb-config-list');
            list.innerHTML = appData.toolbar.map((t, idx) => {
                const core = ALL_TOOLS_REGISTRY[t.id];
                if(!core) return '';
                return `
                    <div class="tb-config-item" data-id="${t.id}">
                        <div class="tb-config-left">
                            <i data-lucide="grip-vertical" class="drag-handle"></i>
                            <i data-lucide="${core.icon}"></i>
                            <span style="font-size:0.95rem; width:100px;">${core.label}</span>
                        </div>
                        <div style="display:flex; gap:15px; align-items:center;">
                            <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px;">文字 
                                <label class="switch"><input type="checkbox" ${t.text ? 'checked':''} onchange="updateTbConf(${idx}, 'text', this.checked)"><span class="slider"></span></label>
                            </label>
                            <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px; border-left:1px solid #ccc; padding-left:10px;">显示 
                                <label class="switch"><input type="checkbox" ${t.visible ? 'checked':''} onchange="updateTbConf(${idx}, 'visible', this.checked)"><span class="slider"></span></label>
                            </label>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function updateTbConf(idx, key, val) {
            appData.toolbar[idx][key] = val;
            saveData(); renderToolbar(); // 实时生效
        }

        function syncToolbarConfig() {
            // Sortable 拖拽后同步DOM顺序到数据
            const items = document.querySelectorAll('.tb-config-item');
            const newArr = [];
            items.forEach(el => {
                const id = el.getAttribute('data-id');
                newArr.push(appData.toolbar.find(t => t.id === id));
            });
            appData.toolbar = newArr;
            saveData();
        }

        // ================= 7. 背景与模态框系统 =================
        function applyBg(bg) {
            const w = document.getElementById('editor-wrapper');
            const c = document.getElementById('editor-content');
            if(!bg) return;
            w.style.backgroundColor = bg.color || '';
            w.style.backgroundImage = bg.img ? `url(${bg.img})` : '';
            c.style.backgroundColor = bg.img ? 'rgba(255,255,255,0.85)' : 'transparent';
        }

        function updateBg(bg) {
            const n = appData.notes.find(x => x.id === cur.noteId);
            if(n) { n.bg = {...n.bg, ...bg}; applyBg(n.bg); saveData(); closeModal('bg-modal'); }
        }

        function uploadBgImg(input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    // 背景图也进行一次强力压缩，防止撑爆
                    compressImage(e.target.result, 1200, base64 => {
                        updateBg({img: base64, color: ''});
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleNightMode() { document.body.classList.toggle('night-mode'); }
        function openModal(id) { const e = document.getElementById(id); e.style.display='flex'; setTimeout(()=>e.classList.add('active'),10); }
        function closeModal(id) { const e = document.getElementById(id); e.classList.remove('active'); setTimeout(()=>e.style.display='none',200); }

    </script>
</body>
</html>
